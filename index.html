<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#150A28">
<title>Plum</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-purple.svg">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#F6F1EA;--fg:#150A28;--muted:#6B6076;--surface:#fff;--line:rgba(21,10,40,.10);
  --purple:#5B10F0;--good:#0E8A5F;--bad:#C2352B;--r:22px;--pad:20px;
  --display:"Helvetica Neue",Inter,"Segoe UI",system-ui,sans-serif;
}
html[data-theme="dark"]{
  --bg:#150A28;--fg:#F6F1EA;--muted:#A797BC;--surface:#221338;--line:rgba(255,255,255,.10);
  --good:#3DD69B;--bad:#FF7A6B;
}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;line-height:1.35;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}

#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 var(--pad) 28px}
.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);
  background:var(--bg);padding:9px 4px calc(9px + env(safe-area-inset-bottom))}
.tabs button{display:grid;justify-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--muted);padding:3px 0}
.tabs button.on{color:var(--fg)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.035em;line-height:1.02}
h1{font-size:30px}h2{font-size:22px}h3{font-size:16px;letter-spacing:-.02em}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.mono-num{font-variant-numeric:tabular-nums}

.hello{display:flex;align-items:center;gap:11px;padding:20px 0 12px}
.hello .greet{display:flex;flex-direction:column;gap:2px}
.hello .greet b{font-size:15px;font-weight:800}
.hello .greet span{font-size:10px;font-weight:800;letter-spacing:.13em;color:var(--muted)}

.mark{position:relative;display:inline-block;width:36px;height:36px;flex:0 0 36px}
.mark img{position:absolute;inset:0;width:36px;height:36px;display:block;object-fit:contain}
html[data-theme="dark"] .mark img[data-v="purple"]{display:none}
html[data-theme="light"] .mark img[data-v="white"]{display:none}
html[data-logo="white"] .mark img[data-v="white"]{display:block!important}
html[data-logo="white"] .mark img[data-v="purple"]{display:none!important}
html[data-logo="purple"] .mark img[data-v="purple"]{display:block!important}
html[data-logo="purple"] .mark img[data-v="white"]{display:none!important}

.bal{font-size:44px;font-weight:800;letter-spacing:-.045em;line-height:1;margin:5px 0 14px}
.split{display:flex;gap:10px;margin-bottom:20px}
.split div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 13px}
.split b{display:block;font-size:14.5px;font-weight:800;margin-top:3px}

.pockets{display:flex;gap:10px;overflow-x:auto;padding:2px 0 18px;scrollbar-width:none}
.pockets::-webkit-scrollbar{display:none}
.pocket{flex:0 0 146px;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:13px;display:flex;flex-direction:column;gap:8px;text-align:left}
.pocket .em{font-size:22px;line-height:1}
.pocket b{font-size:13.5px;font-weight:800}
.pocket .amt{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.pocket.add{align-items:center;justify-content:center;color:var(--muted);border-style:dashed;font-size:12.5px;font-weight:800}

.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left}
.row + .row{border-top:1px solid var(--line)}
.row .lg,.row .mono{flex:0 0 34px;width:34px;height:34px;border-radius:10px}
.lg{display:block;width:34px;height:34px}
.mono{display:grid;place-items:center;background:var(--line);font-weight:800;font-size:14px}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span{font-size:11.5px;color:var(--muted)}
.row .amt{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--good)}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.sec a{font-size:12px;font-weight:800;color:var(--purple);text-decoration:none}
html[data-theme="dark"] .sec a{color:#B79BFF}

.brain{background:var(--purple);color:#fff;border-radius:var(--r);padding:18px;margin:4px 0 18px}
.brain .eyebrow{color:rgba(255,255,255,.7)}
.brain h3{margin:6px 0 6px;font-size:18px}
.brain p{margin:0 0 14px;font-size:13px;color:rgba(255,255,255,.85)}
.brain button{background:#fff;color:#3A0AA6;border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:800}

.plumcard{aspect-ratio:1.586;position:relative;border-radius:20px;padding:18px;
  background:linear-gradient(150deg,#2A1250,#120A24);color:#F6F1EA;
  display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 18px 40px -18px rgba(21,10,40,.55);margin-bottom:16px}
.plumcard .top{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.16em}
.plumcard .num{position:absolute;left:18px;bottom:44px;font-size:17px;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.plumcard .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;font-weight:800;letter-spacing:.1em;margin-top:auto}
.plumcard .foot span{opacity:.75;font-size:9.5px}

.btn{display:block;width:100%;border-radius:999px;padding:15px;font-size:14.5px;font-weight:800;
  text-align:center;background:var(--purple);color:#fff;margin-bottom:10px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn.sm{padding:8px 13px;font-size:13px;width:auto;margin:0}

.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 14px;width:100%;text-align:left}
.opt + .opt{border-top:1px solid var(--line)}
.opt .t{font-size:13.5px;font-weight:700}
.opt .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:0 0 20px}
.opt[aria-pressed="true"] .tick{border-color:var(--purple);background:var(--purple);box-shadow:inset 0 0 0 3px var(--surface)}
.toggle{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:0 0 44px}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .18s}
.opt[aria-pressed="true"] .toggle{background:var(--purple)}
.opt[aria-pressed="true"] .toggle::after{transform:translateX(18px)}

#lock{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;background:var(--bg);padding:30px;max-width:520px;margin:0 auto}
#lock .mark{width:64px;height:64px;flex:0 0 64px}
#lock .mark img{width:64px;height:64px}
#lock h1{font-size:26px;text-align:center}
#lock .pin{display:flex;gap:12px;margin:2px 0 4px}
#lock .pin i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--muted)}
#lock .pin i.f{background:var(--fg);border-color:var(--fg)}
#lock .pad{display:grid;grid-template-columns:repeat(3,74px);gap:11px}
#lock .pad button{height:60px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:700}
#lock .bio{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--purple)}
html[data-theme="dark"] #lock .bio{color:#B79BFF}
#lock .err{font-size:12px;color:var(--bad);height:14px}

#sheet{position:fixed;inset:0;z-index:50;background:rgba(10,5,20,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet .in{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px 30px}
#sheet h3{margin-bottom:14px}
#sheet .field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:22px;font-weight:800;margin-bottom:12px}
#sheet .chips{display:flex;gap:8px;margin-bottom:16px}
#sheet .chips button{flex:1;border:1px solid var(--line);border-radius:999px;padding:9px;font-size:12.5px;font-weight:800}

#crash{position:fixed;inset:0;z-index:99;background:#C2352B;color:#fff;padding:24px;
  font:12px/1.5 ui-monospace,monospace;overflow:auto;white-space:pre-wrap}
</style>
</head>

  </nav>
</div>

      $("#view").innerHTML=html;
      $("#view").scrollTop=0;
      document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.r===ROUTE);});
    }catch(e){crash(e);}
  }
  function crash(e){
    var d=document.createElement("div"); d.id="crash";
    d.textContent="Render failed\n\n"+(e&&e.stack||e)+"\n\nroute: "+ROUTE+"\nhref: "+location.href;
    document.body.appendChild(d);
  }
  function go(r){ROUTE=r;page=0;render();}

  function lock(){
    buf="";
    var el=document.createElement("div"); el.id="lock";
    el.innerHTML='<span class="mark" aria-hidden="true">'+
      '<img data-v="white" src="icon-white.svg" alt="" width="64" height="64">'+
      '<img data-v="purple" src="icon-purple.svg" alt="" width="64" height="64"></span>'+
      '<h1>Welcome back</h1><div class="pin"><i></i><i></i><i></i><i></i></div><div class="err"></div>'+
      '<div class="pad">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-d="'+n+'">'+n+'</button>';}).join("")+
      '<button data-d="x" aria-label="Delete">⌫</button><button data-d="0">0</button><button data-d="b" aria-label="Fingerprint">☝</button></div>'+
      (prefs.bio?'<div class="bio">Touch the sensor to unlock</div>':"");
    el.addEventListener("click",function(ev){
      var b=ev.target.closest("[data-d]"); if(!b) return;
      var d=b.dataset.d;
      if(d==="x") buf=buf.slice(0,-1);
      else if(d==="b"){ if(prefs.bio) return unlock(); }
      else if(buf.length<4) buf+=d;
      el.querySelectorAll(".pin i").forEach(function(dot,i){dot.classList.toggle("f",i<buf.length);});
      if(buf.length===4){
        if(buf===prefs.pin) unlock();
        else{buf="";el.querySelector(".err").textContent="Wrong PIN";
          el.querySelectorAll(".pin i").forEach(function(dot){dot.classList.remove("f");});}
      }
    });
    document.body.appendChild(el);
  }
  function unlock(){var el=$("#lock"); if(el) el.remove();}

  function sheet(html){
    var old=$("#sheet"); if(old) old.remove();
    var el=document.createElement("div"); el.id="sheet";
    el.innerHTML='<div class="in">'+html+'</div>';
    el.addEventListener("click",function(e){if(e.target===el)el.remove();});
    document.body.appendChild(el);
    var f=el.querySelector("input"); if(f) f.focus();
  }
  function num(){var i=$("#sheet input");return parseFloat(String(i&&i.value||"").replace(/[^0-9.]/g,""));}

  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-act]"); if(!b) return;
    var a=b.dataset.act;

    if(a==="go"){go(b.dataset.r);return;}
    if(a==="more"){page++;render();return;}
    if(a==="lock"){lock();return;}
    if(a==="brain"){cash+=38.40;save();render();return;}
    if(a==="theme"){prefs.theme=b.dataset.v; if(b.dataset.v!=="auto") prefs.logo=null; paint();save();render();return;}
    if(a==="logo"){prefs.logo=b.dataset.v==="auto"?null:b.dataset.v; paint();save();render();return;}
    if(a==="bio"){prefs.bio=!prefs.bio; save();render();return;}
    if(a==="tier"){sheet('<h3>Your plan</h3><p class="small muted">Boost — £4.99 a month. Unlimited pockets, fee-free investing and 4.34% interest.</p><button class="btn" data-act="close">Done</button>');return;}
    if(a==="close"){var s=$("#sheet"); if(s)s.remove(); return;}
    if(a==="reset"){tx=seed();cash=3412.87;save();go("home");return;}

    if(a==="newpocket"){
      sheet('<h3>New pocket</h3><input class="field" inputmode="decimal" placeholder="Amount">'+
        '<div class="chips"><button data-p="25">£25</button><button data-p="100">£100</button><button data-p="250">£250</button></div>'+
        '<button class="btn" data-act="savepocket">Create pocket</button>');return;
    }
    if(a==="savepocket"){
      var v=num(); if(!v||v>cash){var i1=$("#sheet input"); if(i1)i1.value=""; return;}
      cash-=v; pockets.push({id:Date.now(),em:"🎯",n:"New pocket",v:v});
      save(); var s1=$("#sheet"); if(s1)s1.remove(); render(); return;
    }
    if(a==="pocket"){
      var p=pockets.find(function(x){return String(x.id)===b.dataset.id;}); if(!p)return;
      sheet('<h3>'+p.em+' '+p.n+'</h3><p class="small muted">'+money(p.v)+' in this pocket.</p>'+
        '<input class="field" inputmode="decimal" placeholder="Amount">'+
        '<div class="chips"><button data-p="25">£25</button><button data-p="100">£100</button><button data-p="250">£250</button></div>'+
        '<button class="btn" data-act="topup" data-id="'+p.id+'">Add money</button>'+
        '<button class="btn ghost" data-act="withdraw" data-id="'+p.id+'">Withdraw all</button>');return;
    }
    if(a==="topup"){
      var v2=num(); if(!v2||v2>cash){var i2=$("#sheet input"); if(i2)i2.value=""; return;}
      var p2=pockets.find(function(x){return String(x.id)===b.dataset.id;});
      cash-=v2; p2.v+=v2; save(); var s2=$("#sheet"); if(s2)s2.remove(); render(); return;
    }
    if(a==="withdraw"){
      var p3=pockets.find(function(x){return String(x.id)===b.dataset.id;});
      cash+=p3.v; p3.v=0; save(); var s3=$("#sheet"); if(s3)s3.remove(); render(); return;
    }
    if(a==="buy"){
      sheet('<h3>Buy '+b.dataset.k+'</h3><input class="field" inputmode="decimal" placeholder="Amount">'+
        '<div class="chips"><button data-p="50">£50</button><button data-p="250">£250</button><button data-p="1000">£1,000</button></div>'+
        '<button class="btn" data-act="dobuy" data-k="'+b.dataset.k+'">Buy</button>');return;
    }
    if(a==="dobuy"){
      var v3=num(); if(!v3||v3>cash){var i3=$("#sheet input"); if(i3)i3.value=""; return;}
      var h=holdings.find(function(x){return x.k===b.dataset.k;});
      cash-=v3; h.v+=v3; save(); var s4=$("#sheet"); if(s4)s4.remove(); render(); return;
    }
  });

  document.addEventListener("click",function(e){
    var c=e.target.closest("[data-p]"); if(!c) return;
    var i=$("#sheet input"); if(i) i.value=c.dataset.p;
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){var s=$("#sheet"); if(s)s.remove();}
  });

  window.__plumErrors=[];
  window.addEventListener("error",function(e){window.__plumErrors.push(e.message+" @ "+e.filename+":"+e.lineno);});

  load(); paint(); render(); lock();
})();
</script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
  if(location.search.indexOf("reset=1")>-1){
    caches.keys().then(function(k){return Promise.all(k.map(function(n){return caches.delete(n);}));})
      .then(function(){return navigator.serviceWorker.getRegistrations();})
      .then(function(r){return Promise.all(r.map(function(x){return x.unregister();}));})
      .then(function(){location.replace(location.pathname);});
  }
}
</script>
</body>
</html>
