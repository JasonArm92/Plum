<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#150A28">
<title>Plum</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-purple.svg">
<link rel="stylesheet" href="styles.css">
<script>window.__plumErrors=[];window.addEventListener("error",function(e){window.__plumErrors.push(e.message+" @ "+e.filename+":"+e.lineno)});</script>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav class="tabs">
    <button data-r="home" class="on" data-act="go" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg>
    </button>
    <button data-r="invest" data-act="go" aria-label="Invest">
      <svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
    </button>
    <button data-r="cards" data-act="go" aria-label="Cards">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="M2.5 10h19"/></svg>
    </button>
    <button data-r="activity" data-act="go" aria-label="Activity">
      <svg viewBox="0 0 24 24"><path d="M3 12h4l3 7 4-14 3 7h4"/></svg>
    </button>
    <button data-r="more" data-act="go" aria-label="More">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
    </button>
  </nav>
</div>
<script src="logos.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
  if (location.search.indexOf("reset=1") > -1) {
    caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); })
      .then(function () { return navigator.serviceWorker.getRegistrations(); })
      .then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); })
      .then(function () { location.replace(location.pathname); });
  }
}
</script>
</body>
</html>
