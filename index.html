<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF4F40">
<title>Monzo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="monzo-tile.svg">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --coral:#FF4F40;--ink:#091723;--ink-2:#112231;
  --bg:#FFFFFF;--surface:#F2F8F3;--mint:#E3EBE4;--fg:#091723;--muted:#3B4C54;
  --line:rgba(9,23,35,.12);--soft:rgba(9,23,35,.06);
  --good:#0E7A4F;--bad:#C2352B;--amber:#B26B00;
  --r:24px;--r-lg:32px;--pill:500px;
  --sans:Inter,"Helvetica Neue",-apple-system,system-ui,sans-serif;
}
html[data-theme="dark"]{
  --bg:#091723;--surface:#112231;--mint:#16293A;--fg:#FFFFFF;--muted:#B8C2CC;
  --line:rgba(255,255,255,.12);--soft:rgba(255,255,255,.06);
  --good:#3DD69B;--bad:#FF7A6B;--amber:#F2B44C;
}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 20px 28px;position:relative}
#view.fade{animation:fade .2s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
.anim{animation:rise .34s cubic-bezier(.2,.8,.3,1) both}

.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);
  background:var(--bg);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.tabs button{display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;
  transition:color .15s,transform .12s}
.tabs button:active{transform:scale(.92)}
.tabs button.on{color:var(--fg)}
.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

h1,h2,h3{margin:0;font-weight:800;letter-spacing:0;line-height:1.2}
h1{font-size:31px}h2{font-size:25px}h3{font-size:20px;font-weight:700}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}

.brand{display:flex;align-items:center;gap:10px;padding:18px 0 10px}
.wordmark{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1;flex:1}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--coral);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 36px}
.bell{position:relative;width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:0 0 36px}
.bell .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:1.5px solid var(--bg)}

.head{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
.head h1{font-size:25px;flex:1}
.back{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:0 0 36px;font-size:19px}

.balance{font-size:44px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.sub{font-size:14px;color:var(--muted);margin-bottom:16px}

.card{aspect-ratio:1.586;position:relative;border-radius:var(--r);padding:18px;background:var(--coral);
  color:#fff;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 12px 26px -14px rgba(255,79,64,.65);margin-bottom:14px;transition:filter .2s,transform .2s;
  touch-action:pan-y;user-select:none}
.card.frozen{filter:saturate(.2) brightness(.85)}
.card:active{transform:scale(.985)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start}
.card .mark{width:26px;height:26px;display:block}
.card .chip{width:30px;height:23px;border-radius:5px;background:rgba(255,255,255,.35)}
.card .pan{position:absolute;left:18px;bottom:44px;font-size:16px;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.card .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;font-weight:700;letter-spacing:.08em;margin-top:auto}
.card .foot span{opacity:.8;font-size:10px}

.btn{display:block;width:100%;border-radius:var(--pill);padding:14px 24px;font-size:16px;font-weight:600;
  text-align:center;background:var(--ink);color:#fff;margin-bottom:10px;min-height:51px;
  transition:transform .12s,opacity .15s}
html[data-theme="dark"] .btn{background:#fff;color:var(--ink)}
.btn:active{transform:scale(.975);opacity:.9}
.btn.ghost{background:var(--surface);color:var(--fg)}
.btn.outline{background:transparent;border:1px solid var(--fg);color:var(--fg)}
.btn.sm{padding:9px 16px;font-size:14px;width:auto;min-height:0;margin:0}

.rows{background:var(--surface);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;animation:rise .3s both}
.row+.row{border-top:1px solid var(--soft)}
.row .lg,.row .mono{flex:0 0 38px;width:38px;height:38px;border-radius:50%;overflow:hidden}
.lg{display:block;width:38px;height:38px}
.mono{display:grid;place-items:center;background:var(--mint);font-weight:800;font-size:15px;color:var(--fg)}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span{font-size:13px;color:var(--muted)}
.row .amt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--good)}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.sec h3{font-size:20px;font-weight:700}
.sec a{font-size:14px;font-weight:600;color:var(--coral);text-decoration:none}

.pots{display:flex;gap:10px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:none}
.pots::-webkit-scrollbar{display:none}
.pot{flex:0 0 132px;background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:transform .12s}
.pot:active{transform:scale(.96)}
.pot .em{font-size:24px;line-height:1}
.pot b{font-size:14px;font-weight:600}
.pot .amt{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.pot.add{align-items:center;justify-content:center;color:var(--muted);font-size:13px;font-weight:600;border:1px dashed var(--line)}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.3,1)}

.meter{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;background:var(--ink);transition:width .6s cubic-bezier(.2,.8,.3,1)}
html[data-theme="dark"] .meter i{background:#fff}

.chart{display:flex;align-items:flex-end;gap:5px;height:140px;margin:8px 0 4px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
.chart i{display:block;width:100%;background:var(--coral);border-radius:4px 4px 2px 2px;min-height:3px;
  animation:grow .6s cubic-bezier(.2,.8,.3,1) both;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chart span{font-size:9px;font-weight:700;color:var(--muted)}

.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--soft)}

.search{width:100%;background:var(--surface);border-radius:var(--pill);padding:13px 18px;margin-bottom:12px;border:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border-radius:var(--pill);padding:9px 15px;font-size:13px;font-weight:600;background:var(--surface);color:var(--muted)}
.chips button.on{background:var(--fg);color:var(--bg)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}

.group{background:var(--surface);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;width:100%;text-align:left}
.opt+.opt{border-top:1px solid var(--soft)}
.opt .t{font-size:15px;font-weight:600}
.opt .s{font-size:13px;color:var(--muted);margin-top:2px}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 22px;transition:all .15s}
.opt[aria-pressed="true"] .tick{border-color:var(--coral);background:var(--coral);box-shadow:inset 0 0 0 3px var(--surface)}
.toggle{width:46px;height:27px;border-radius:99px;background:var(--line);position:relative;flex:0 0 46px;transition:background .18s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .18s}
.opt[aria-pressed="true"] .toggle{background:var(--coral)}
.opt[aria-pressed="true"] .toggle::after{transform:translateX(19px)}

.tile{display:flex;align-items:center;gap:14px;background:var(--coral);color:#fff;border-radius:var(--r);
  padding:18px;margin-bottom:14px;text-align:left;width:100%;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:26px}
.tile b{display:block;font-size:17px;font-weight:700}
.tile span{font-size:13px;opacity:.85}

#pull{position:absolute;top:0;left:0;right:0;display:grid;place-items:center;height:0;overflow:hidden;color:var(--muted);font-size:13px}

#lock{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;background:var(--bg);padding:30px;max-width:520px;margin:0 auto}
#lock .wordmark{font-size:34px;color:var(--coral);flex:none}
#lock h1{font-size:25px;text-align:center}
#lock .pin{display:flex;gap:12px}
#lock .pin i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--muted);transition:all .15s}
#lock .pin i.f{background:var(--fg);border-color:var(--fg);transform:scale(1.1)}
#lock .pad{display:grid;grid-template-columns:repeat(3,74px);gap:11px}
#lock .pad button{height:60px;border-radius:var(--pill);background:var(--surface);font-size:22px;font-weight:600;transition:transform .1s}
#lock .pad button:active{transform:scale(.92)}
#lock .bio{font-size:14px;font-weight:600;color:var(--coral)}
#lock .err{font-size:13px;color:var(--bad);height:15px}

#sheet{position:fixed;inset:0;z-index:50;background:rgba(9,23,35,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet .in{background:var(--bg);width:100%;max-width:520px;border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:10px 20px 30px;max-height:88vh;overflow:auto;animation:slideUp .32s cubic-bezier(.2,.9,.25,1.02)}
#sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
#sheet h3{margin-bottom:14px}
#sheet .field{width:100%;background:var(--surface);border:0;border-radius:18px;padding:15px;font-size:22px;font-weight:800;margin-bottom:12px}
#sheet .chips{margin-bottom:16px}
#sheet .chips button{flex:1;text-align:center}

#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:96px;z-index:70;background:var(--ink);color:#fff;
  border-radius:var(--pill);padding:12px 20px;font-size:14px;font-weight:600;opacity:0;
  transition:opacity .2s,transform .25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
#crash{position:fixed;inset:0;z-index:99;background:#C2352B;color:#fff;padding:24px;
  font:12px/1.5 ui-monospace,monospace;overflow:auto;white-space:pre-wrap}
</style>
</head>

</div>

function seed(){
  var r=mulberry(20260119),now=Date.now(),out=[],id=1;
  var d=new Date();d.setMonth(d.getMonth()-12);d.setHours(0,0,0,0);
  for(;d.getTime()<now;d.setDate(d.getDate()+1)){
    var m=d.getMonth()+1,dom=d.getDate(),dow=d.getDay();
    for(var i=0;i<M.length;i++){
      var x=M[i],p=0;
      if(x.cad==="d")p=0.16*(x.w/5);
      else if(x.cad==="w")p=(dow===x.dow)?0.6*(x.w/6):0;
      else p=(dom===((i%27)+2))?0.85:0;
      if(x.sea&&x.sea[m])p*=x.sea[m];
      if(r()>p)continue;
      var amt=x.fixed?x.b[0]:x.b[0]+r()*(x.b[1]-x.b[0]);
      if(x.sea&&x.sea[m]&&!x.fixed)amt*=x.sea[m];
      var at=new Date(d);at.setHours(6+Math.floor(r()*16),Math.floor(r()*60),0,0);
      if(at.getTime()>now)continue;
      out.push({id:id++,t:at.getTime(),s:x.s,n:x.n,c:x.c,a:-Math.round(amt*100)/100});
    }
    if(dom===28){var pay=new Date(d);pay.setHours(7,4,0,0);
      if(pay.getTime()<now)out.push({id:id++,t:pay.getTime(),s:"",n:"Kestrel Digital Ltd",c:"Income",a:4250});}
  }
  out.sort(function(a,b){return b.t-a.t;});
  return out;
}

function confetti(){
  var c=document.createElement("canvas");c.id="confetti";
  c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  var x=c.getContext("2d"),ps=[],cols=["#FF4F40","#091723","#E3EBE4","#FFB3A7"];
  for(var i=0;i<90;i++)ps.push({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*9,vy:-Math.random()*9-2,s:3+Math.random()*4,c:cols[i%4],r:Math.random()*6});
  var t0=performance.now();
  (function loop(t){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(function(p){p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.r+=.15;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s);x.restore();});
    if(t-t0<1800)requestAnimationFrame(loop);else c.remove();
  })(t0);
}

function countUp(el,to){
  var from=lastTotal||to;lastTotal=to;
  if(from===to||!el){if(el)el.textContent=money(to);return;}
  var t0=performance.now();
  (function step(t){
    var p=Math.min(1,(t-t0)/650),e=1-Math.pow(1-p,3);
    el.textContent=money(from+(to-from)*e);
    if(p<1)requestAnimationFrame(step);
  })(t0);
}

function monthSpend(o){

    return (d.getMonth()===m&&d.getFullYear()===y&&t.a<0)?a+Math.abs(t.a):a;},0);
}
function catSpend(c){
  var n=new Date(),y=n.getFullYear(),m=n.getMonth();
  return tx.reduce(function(a,t){var d=new Date(t.t);
    return (d.getMonth()===m&&d.getFullYear()===y&&t.c===c&&t.a<0)?a+Math.abs(t.a):a;},0);
}
function recurring(){
  var by={};
  tx.forEach(function(t){if(t.a<0){(by[t.s]=by[t.s]||[]).push(t);}});
  var out=[];
  Object.keys(by).forEach(function(s){
    var l=by[s];if(l.length<3)return;
    var gaps=[];for(var i=1;i<l.length;i++)gaps.push(Math.abs(l[i].t-l[i-1].t));
    var avg=gaps.reduce(function(a,b){return a+b;},0)/gaps.length;
    var jit=Math.max.apply(null,gaps.map(function(g){return Math.abs(g-avg);}))/avg;
    if(avg>25*864e5&&avg<40*864e5&&jit<0.4){
      var m=Math.round(l.slice(0,3).reduce(function(a,t){return a+Math.abs(t.a);},0)/3*100)/100;
      out.push({s:s,n:l[0].n,m:m,next:l[0].t+avg});
    }
  });
  return out.sort(function(a,b){return b.m-a.m;});
}

function listBody(shown,totalN){
  var out="",last="";
  shown.forEach(function(t,i){
    var d=new Date(t.t),m=d.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
    if(m!==last){
      var net=shown.filter(function(x){var y=new Date(x.t);return y.getMonth()===d.getMonth()&&y.getFullYear()===d.getFullYear();})
        .reduce(function(a,x){return a+x.a;},0);
      out+='<div class="mhead"><div class="eyebrow">'+m+'</div><span class="small num '+(net>0?"pos":"muted")+'">'+signed(net)+'</span></div>';
      last=m;
    }
    out+='<div class="rows" style="margin-bottom:0">'+row(t,i)+'</div>';
  });
  if(!shown.length)out='<p class="muted small">No matches.</p>';
  if(shown.length<totalN)out+='<button class="btn ghost" style="margin:16px 0" data-act="more">Load more</button>';
  return out;
}

    var d=b.dataset.d;
    if(d==="x")buf=buf.slice(0,-1);

  el.addEventListener("click",function(e){if(e.target===el)el.remove();});
  document.body.appendChild(el);
  var f=el.querySelector("input");if(f)f.focus();
  dragSheet(el);
}
function dragSheet(el){
  var inner=el.querySelector(".in"),y0=0,dy=0,on=false;
  inner.addEventListener("touchstart",function(e){
    if(inner.scrollTop>0)return;on=true;y0=e.touches[0].clientY;dy=0;inner.style.transition="none";
  },{passive:true});
  inner.addEventListener("touchmove",function(e){
    if(!on)return;dy=Math.max(0,e.touches[0].clientY-y0);
    inner.style.transform="translateY("+dy+"px)";
  },{passive:true});
  inner.addEventListener("touchend",function(){
    if(!on)return;on=false;inner.style.transition="transform .24s";
    if(dy>110){inner.style.transform="translateY(100%)";setTimeout(function(){el.remove();},220);}
    else inner.style.transform="";
  });
}

     '<button class="btn ghost" data-act="merchant" data-s="'+t.s+'">Merchant history</button>'+

     '<button class="btn ghost" data-act="close">Close</button>');
    return;
  }
  if(a==="merchant"){
    var s2=b.dataset.s;
    var list=tx.filter(function(x){return x.s===s2;}).slice(0,12);
    var nm=list[0]?list[0].n:s2;
    sheet('<h3>'+esc(nm)+'</h3><p class="small muted">'+list.length+' payments · '+money(list.reduce(function(acc,x){return acc+Math.abs(x.a);},0))+' total</p>'+
     list.map(function(x){return '<div class="row" style="padding:9px 0"><div class="mid"><b>'+
      new Date(x.t).toLocaleDateString("en-GB",{day:"numeric",month:"short"})+'</b></div>'+
      '<div class="amt">'+money(Math.abs(x.a))+'</div></div>';}).join("")+
     '<button class="btn" data-act="close">Close</button>');
    return;
  }
  if(a==="note"){
    var t2=tx.find(function(x){return String(x.id)===b.dataset.id;});
    sheet('<h3>Note</h3><input class="field" value="'+esc(t2.note||"")+'" placeholder="What was this for?">'+
     '<button class="btn" data-act="savenote" data-id="'+t2.id+'">Save</button>');
    return;
  }
  if(a==="savenote"){
    var t3=tx.find(function(x){return String(x.id)===b.dataset.id;});
    var i2=$("#sheet input");t3.note=i2?i2.value:"";save();closeSheet();toast("Note saved");return;
  }
  if(a==="split"){
    var t4=tx.find(function(x){return String(x.id)===b.dataset.id;});
    toast("Split request sent for "+money(Math.abs(t4.a)/2));return;
  }

  if(a==="fund"){
    var h=holdings.find(function(x){return x.k===b.dataset.k;});if(!h)return;
    sheet('<div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">'+logo("",h.k)+
     '<div><h3 style="margin:0">'+h.k+'</h3><span class="small muted">'+esc(h.n)+'</span></div></div>'+
     '<p class="num" style="font-size:28px;font-weight:800;margin:0">'+money(h.v)+'</p>'+
     '<p class="small pos" style="margin:2px 0 14px">+'+money(h.v-h.c)+' ('+((h.v-h.c)/h.c*100).toFixed(2)+'%)</p>'+
     '<button class="btn" data-act="buy" data-k="'+h.k+'">Buy more</button>'+
     '<button class="btn ghost" data-act="sell" data-k="'+h.k+'">Sell 25%</button>');
    return;
  }
  if(a==="buy"){
    sheet('<h3>Buy '+b.dataset.k+'</h3><input class="field" inputmode="decimal" placeholder="Amount">'+
     '<div class="chips"><button data-p="50">£50</button><button data-p="250">£250</button><button data-p="1000">£1,000</button></div>'+
     '<button class="btn" data-act="dobuy" data-k="'+b.dataset.k+'">Buy</button>');
    return;
  }
  if(a==="dobuy"){
    var v2=num();if(!v2||v2>cash){var i3=$("#sheet input");if(i3)i3.value="";return;}
    var h2=holdings.find(function(x){return x.k===b.dataset.k;});
    cash-=v2;h2.v+=v2;h2.c+=v2;isa=Math.min(20000,isa+v2);save();closeSheet();toast("Bought "+money(v2));render();return;
  }
  if(a==="sell"){
    var h3=holdings.find(function(x){return x.k===b.dataset.k;});
    var v3=Math.min(h3.v,Math.round(h3.v*0.25*100)/100);
    h3.v-=v3;cash+=v3;save();closeSheet();toast("Sold "+money(v3));render();return;
  }

  if(a==="cancel"){
    var slug=b.dataset.s;
    tx=tx.filter(function(t){return !(t.s===slug&&t.c==="Subscriptions");});
    save();toast("Cancelled");render();return;
  }

  if(a==="challenge"){
    sheet('<h3>1p savings challenge</h3><p class="small muted">Start at 1p on day one and add a penny a day. Day 365 is £3.65, and you finish with £667.95.</p>'+
     '<button class="btn" data-act="startchallenge">Start challenge</button>');
    return;
  }
  if(a==="startchallenge"){
    pots.push({id:Date.now(),em:"🪙",n:"1p challenge",v:0.01,goal:667.95,bills:false,locked:false,joint:false});
    save();closeSheet();toast("Challenge started");render();return;
  }

  if(a==="newpot"){
    sheet('<h3>New pot</h3><input class="field" inputmode="decimal" placeholder="Amount to start">'+
     '<div class="chips"><button data-p="25">£25</button><button data-p="100">£100</button><button data-p="250">£250</button></div>'+
     '<button class="btn" data-act="savepot">Create pot</button>');
    return;
  }
  if(a==="savepot"){
    var v4=num();if(!v4||v4>cash){var i4=$("#sheet input");if(i4)i4.value="";return;}
    cash-=v4;pots.push({id:Date.now(),em:"🎯",n:"New pot",v:v4,goal:Math.max(500,v4*4),bills:false,locked:false,joint:false});
    save();closeSheet();toast("Pot created");render();return;
  }
  if(a==="pot"){
    var p=pots.find(function(x){return String(x.id)===b.dataset.id;});if(!p)return;
    sheet('<h3>'+p.em+' '+esc(p.n)+'</h3><p class="small muted">'+money(p.v)+' of '+money(p.goal)+'</p>'+
     '<div class="meter"><i style="width:'+Math.min(100,p.v/p.goal*100)+'%"></i></div>'+
     '<input class="field" style="margin-top:14px" inputmode="decimal" placeholder="Amount">'+
     '<div class="chips"><button data-p="25">£25</button><button data-p="100">£100</button><button data-p="250">£250</button></div>'+
     '<button class="btn" data-act="topup" data-id="'+p.id+'">Add money</button>'+
     '<button class="btn ghost" data-act="bills" data-id="'+p.id+'">'+(p.bills?"Turn off bills pot":"Make this a bills pot")+'</button>'+
     '<button class="btn ghost" data-act="joint" data-id="'+p.id+'">'+(p.joint?"Make personal":"Make joint")+'</button>'+
     '<button class="btn ghost" data-act="withdraw" data-id="'+p.id+'">Withdraw all</button>');
    return;
  }
  if(a==="topup"){
    var v5=num();if(!v5||v5>cash){var i5=$("#sheet input");if(i5)i5.value="";return;}
    var p2=pots.find(function(x){return String(x.id)===b.dataset.id;});
    cash-=v5;p2.v+=v5;save();closeSheet();
    if(p2.v>=p2.goal){confetti();toast("Goal reached on "+p2.n);}else toast("Added "+money(v5));
    render();return;
  }
  if(a==="bills"){
    var p3=pots.find(function(x){return String(x.id)===b.dataset.id;});
    p3.bills=!p3.bills;save();closeSheet();render();return;
  }
  if(a==="joint"){
    var p4=pots.find(function(x){return String(x.id)===b.dataset.id;});
    p4.joint=!p4.joint;save();closeSheet();render();return;
  }
  if(a==="withdraw"){
    var p5=pots.find(function(x){return String(x.id)===b.dataset.id;});
    cash+=p5.v;p5.v=0;save();closeSheet();toast("Withdrawn");render();return;
  }

  if(a==="editbudget"){
    sheet('<h3>Adjust a budget</h3>'+Object.keys(budgets).map(function(c){
      return '<label style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)">'+
       '<span class="small">'+c+'</span><input data-b="'+c+'" inputmode="decimal" value="'+budgets[c]+'" style="width:80px;text-align:right;background:none;border:0;font-weight:800">'+
       '</label>';}).join("")+'<button class="btn" style="margin-top:14px" data-act="savebudget">Save</button>');
    return;
  }
  if(a==="savebudget"){
    $$("#sheet [data-b]").forEach(function(i){var v6=parseFloat(i.value);if(v6>0)budgets[i.dataset.b]=v6;});
    save();closeSheet();toast("Budgets updated");render();return;
  }

  if(a==="pin"){
    sheet('<h3>Change PIN</h3><input class="field" inputmode="numeric" maxlength="4" placeholder="New 4 digits">'+
     '<button class="btn" data-act="savepin">Save PIN</button>');
    return;
  }
  if(a==="savepin"){
    var i6=$("#sheet input");var v7=String(i6&&i6.value||"").replace(/\D/g,"");
    if(v7.length!==4)return;prefs.pin=v7;save();closeSheet();toast("PIN changed");return;
  }

  if(a==="dosort"){
    pots[2].v+=600;pots[0].v+=Math.round(4250*0.4*100)/100;
    cash+=4250-600-Math.round(4250*0.4*100)/100;
    tx.unshift({id:Date.now(),t:Date.now(),s:"",n:"Kestrel Digital Ltd",c:"Income",a:4250});
    save();confetti();toast("Salary sorted");go("home");return;
  }
  if(a==="paidearly"){
    if(paidEarly){toast("Already paid early");return;}
    paidEarly=true;cash+=4250;
    tx.unshift({id:Date.now(),t:Date.now(),s:"",n:"Kestrel Digital Ltd",c:"Income",a:4250});
    save();confetti();toast("£4,250.00 paid in early");go("home");return;
  }
  if(a==="sortedit"){toast("Editing "+b.dataset.to);return;}
  if(a==="send"){
    sheet('<h3>Send money</h3><input class="field" inputmode="decimal" placeholder="Amount">'+
     '<div class="chips"><button data-p="10">£10</button><button data-p="50">£50</button><button data-p="100">£100</button></div>'+
     '<button class="btn" data-act="dosend">Send</button>');
    return;
  }
  if(a==="dosend"){
    var v8=num();if(!v8||v8>cash){var i7=$("#sheet input");if(i7)i7.value="";return;}
    cash-=v8;tx.unshift({id:Date.now(),t:Date.now(),s:"",n:"Sophie Turner",c:"Transfers",a:-v8});
    save();closeSheet();toast("Sent "+money(v8));render();return;
  }
  if(a==="request"){toast("Request link copied");return;}
  if(a==="monzome"){toast("monzo.me link copied");return;}
  if(a==="banktransfer"){sheet('<h3>Bank transfer</h3><p class="small muted">Sort code</p><p class="num" style="font-size:20px;margin:0 0 10px">04-00-04</p><p class="small muted">Account number</p><p class="num" style="font-size:20px;margin:0 0 16px">8844 1172</p><button class="btn" data-act="close">Done</button>');return;}
  if(a==="flexplan"){sheet('<h3>Flex a purchase</h3><p class="small muted">Choose a recent payment</p>'+
    tx.filter(function(t){return t.a<0&&Math.abs(t.a)>20;}).slice(0,4).map(function(t){
      return '<div class="row" style="padding:10px 0">'+logo(t.s,t.n)+'<div class="mid"><b>'+esc(t.n)+'</b>'+
       '<span>'+money(Math.abs(t.a))+' · 3 × '+money(Math.abs(t.a)/3)+'</span></div></div>';}).join("")+
    '<button class="btn" data-act="close">Close</button>');return;}
  if(a==="flexlimit"){toast("Limit changes take a minute");return;}

  if(a==="export"){
    var rows=[["Date","Merchant","Category","Amount"]];
    tx.forEach(function(t){rows.push([new Date(t.t).toISOString(),t.n,t.c,t.a.toFixed(2)]);});
    var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
    var blob=new Blob([csv],{type:"text/csv"});var url=URL.createObjectURL(blob);
    var a2=document.createElement("a");a2.href=url;a2.download="monzo-statement.csv";a2.click();
    setTimeout(function(){URL.revokeObjectURL(url);},1500);toast("CSV downloaded");return;
  }
  if(a==="reset"){
    tx=seed();cash=3412.87;paidEarly=false;holdings=buildHoldings();save();go("home");toast("Data rebuilt");return;
  }
});

document.addEventListener("click",function(e){
  var c=e.target.closest("[data-p]");if(!c)return;
  var i=$("#sheet input");if(i)i.value=c.dataset.p;
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});

window.__errors=[];
window.addEventListener("error",function(e){window.__errors.push(e.message+" @ "+e.filename+":"+e.lineno);});

load();paint();render();lock();
if(!prefs.seen){
  prefs.seen=true;save();
  setTimeout(function(){
    sheet('<h3>What\'s new</h3><p class="small muted">Trends now has a spending calendar, pots can be joint, and card controls sit in one place.</p>'+
     '<button class="btn" data-act="close">Got it</button>');
  },900);
}
})();
</script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
  if(location.search.indexOf("reset=1")>-1){
    caches.keys().then(function(k){return Promise.all(k.map(function(n){return caches.delete(n);}));})
      .then(function(){return navigator.serviceWorker.getRegistrations();})
      .then(function(r){return Promise.all(r.map(function(x){return x.unregister();}));})
      .then(function(){location.replace(location.pathname);});
  }
}
</script>
