<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monzo</title>
<meta name="theme-color" content="#FF4F40">
<meta name="description" content="Your money, in one place.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://logo.clearbit.com data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="monzo-tile.svg?v=17" type="image/svg+xml">
<link rel="apple-touch-icon" href="monzo-maskable.svg?v=17">
<link rel="stylesheet" href="styles.css?v=17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monzo">
<script>
window.onerror = (m, s, l, c) => {
  let b = document.getElementById('errBanner');
  if (!b){
    b = document.createElement('div');
    b.id = 'errBanner';
    b.setAttribute('role', 'alert');
    b.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:999;background:#d70015;color:#fff;font:12px/1.4 monospace;padding:8px 10px;border-radius:8px;white-space:pre-wrap';
    document.body.appendChild(b);
  }
  b.textContent = 'JS error: ' + m + ' @' + l + ':' + c;
};
</script>
</head>
<body class="locked">
<a class="skip" href="#main">Skip to content</a>
<div class="offline" id="offbar">You're offline — showing your last saved data</div>

<div id="lock">
  <img class="mark" src="monzo-mark-white.svg?v=17" alt="">
  <h1>Welcome back, Jason</h1>
  <p>Unlock to see your money</p>
  <button class="bio" id="bioBtn" aria-label="Unlock with fingerprint">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-3 0-5.6 1.2-7.5 3.1l1.4 1.4C7.4 5.9 9.6 5 12 5s4.6.9 6.1 2.5l1.4-1.4C17.6 4.2 15 3 12 3zm0 3a6 6 0 00-4.2 1.7l1.4 1.4A4 4 0 0112 8a4 4 0 013.9 3.1l1.9-.4A6 6 0 0012 6zm0 4a2 2 0 00-1.4.6l1.4 1.4 1.4-1.4A2 2 0 0012 10zm-5.6.3l-1.9.4A8 8 0 0011 21v-2a6 6 0 00-4.6-8.7zM13 13v8h1a8 8 0 003.7-.9l-.9-1.8A6 6 0 0015 19v-6h-2z"/></svg>
  </button>
  <button class="lockbtn" id="usePin">Use passcode</button>
  <div id="pinpad">
    <div class="dots" id="dots"></div>
    <div class="keys" id="keys"></div>
    <div class="err" id="pinErr">Incorrect passcode</div>
  </div>
</div>

<div id="app" aria-live="polite">
  <header class="hdr" id="hdr">
    <button class="hdr__back" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="avatar" id="avatarBtn" aria-label="Profile and settings"></button>
    <div class="hdr__spacer"></div>
    <span class="hdr__title" id="hdrTitle"></span>
    <button class="iconbtn" id="searchBtn" aria-label="Search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    </button>
    <button class="iconbtn" id="bellBtn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 10-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M13.7 20a2 2 0 01-3.4 0"/></svg>
      <i class="hdr__dot" id="bellDot"></i>
    </button>
    <button class="iconbtn" id="privBtn" aria-label="Toggle privacy mode">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="iconbtn" id="plusBtn" aria-label="Add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    </button>
  </header>

  <main id="main">
    <section data-screen="home" class="on"></section>
    <section data-screen="save"></section>
    <section data-screen="grow"></section>
    <section data-screen="pay"></section>
    <section data-screen="trends"></section>
    <section data-screen="account"></section>
    <section data-screen="acc"></section>
    <section data-screen="pots"></section>
    <section data-screen="potdetail"></section>
    <section data-screen="invest"></section>
    <section data-screen="statements"></section>
    <section data-screen="payees"></section>
    <section data-screen="cards"></section>
    <section data-screen="plan"></section>
    <section data-screen="limits"></section>
    <section data-screen="borrow"></section>
    <section data-screen="flex"></section>
    <section data-screen="aura"></section>
    <section data-screen="overdraft"></section>
    <section data-screen="loans"></section>
    <section data-screen="connected"></section>
    <section data-screen="credit"></section>
    <section data-screen="challenge"></section>
    <section data-screen="billsback"></section>
    <section data-screen="insurance"></section>
    <section data-screen="accounts"></section>
    <section data-screen="appearance"></section>
    <section data-screen="search"></section>
    <section data-screen="notifs"></section>
    <section data-screen="chat"></section>
    <section data-screen="disputes"></section>
    <section data-screen="joint"></section>
    <section data-screen="personal"></section>
    <section data-screen="security"></section>
    <section data-screen="txdetail"></section>
  </main>

  <nav class="tabbar">
    <button data-go="home" class="on" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</button>
    <button data-go="save" aria-label="Save"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9"/><path d="M12 9c0-3 2-5 5-5 0 3-2 5-5 5z"/><path d="M12 13c0-2.5-1.7-4-4-4 0 2.5 1.7 4 4 4z"/></svg>Save</button>
    <button data-go="grow" aria-label="Grow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-6 4 3 6-8"/><path d="M15 7h4v4"/></svg>Grow</button>
    <button data-go="pay" aria-label="Pay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16"/><path d="M14 6l6 6-6 6"/></svg>Pay</button>
    <button data-go="account" aria-label="Account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>Account</button>
  </nav>
</div>

<div class="sheet" id="sheet"><div class="scrim" data-close></div><div class="panel" id="panel"></div></div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="main.js?v=17"></script>
</body>
</html>
