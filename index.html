<style>

p{margin:0;line-height:1.5}
a{color:var(--violet);text-decoration:none;font-weight:700;cursor:pointer}
.pad{padding:0 18px}
.hdr{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.hdr .ttl{flex:1;font-family:Archivo,Inter,sans-serif;font-weight:900;font-size:22px;letter-spacing:-.035em}
.hdr .back{border:0;background:none;color:var(--violet);font-size:26px;font-weight:800;padding:0 6px 0 0;cursor:pointer;line-height:1}

.sw{position:relative;width:48px;height:28px;flex:0 0 auto;border-radius:99px;background:var(--line);border:0;cursor:pointer;transition:.18s}
.sw[aria-checked="true"]{background:var(--violet)}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.18s}
.sw[aria-checked="true"] i{left:23px}

.sheet .inner{background:var(--bg);width:100%;border-radius:26px 26px 0 0;padding:18px;max-height:86%;overflow-y:auto}
.toast{position:absolute;left:14px;right:14px;bottom:76px;background:var(--ink);color:#FBF6E9;padding:13px 16px;border-radius:16px;font-weight:700;font-size:13px;z-index:80;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.banner{background:#FFF3CD;color:#6B4E00;padding:11px 16px;font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:center;border-radius:14px;margin-bottom:10px}
.banner.info{background:var(--lilac);color:#3A1A6E}
@media(prefers-color-scheme:dark){.banner{background:#3A2E10;color:#FFE49B}.banner.info{background:#2E2050;color:#D9C7FF}}
.nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:8px 0 6px}
.nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:10.5px;font-weight:700;display:grid;gap:4px;justify-items:center;padding:4px 0;cursor:pointer}
.nav button.on{color:var(--violet)}
.nav svg{width:23px;height:23px}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .e{font-size:30px;margin-bottom:8px}
.fp{width:74px;height:74px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;margin:0 auto;border:0;cursor:pointer;animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(109,10,224,0)}100%{box-shadow:0 0 0 0 rgba(109,10,224,0)}}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--violet);border-radius:9px}
.alloc{display:flex;height:10px;border-radius:9px;overflow:hidden;gap:2px}
.alloc i{display:block;height:100%}
.mhead{font-size:11px;font-weight:800;color:var(--muted);padding:14px 0 2px;text-transform:uppercase;letter-spacing:.07em}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>

<script>
'use strict';
const TARGET=934745.32,V=13,KEY='plum_v13',OLDS=['plum_v12','plum_v11','plum_v10'];
const BUDGET_MAX=250,FEE_M=4.99,PLAT=0.0015,SEEDV=3;
const BH=['2024-01-01','2024-03-29','2024-04-01','2024-05-06','2024-05-27','2024-08-26','2024-12-25','2024-12-26','2025-01-01','2025-04-18','2025-04-21','2025-05-05','2025-05-26','2025-08-25','2025-12-25','2025-12-26','2026-01-01','2026-04-03','2026-04-06','2026-05-04','2026-05-25','2026-08-31','2026-12-25','2026-12-28'];
const MERCH=['Tesco','Costa','Sainsbury\u2019s','Pret','Boots','Shell','Amazon','Deliveroo','Greggs','Lidl','Uber','Screwfix','Co-op','M&S','Waterstones','Aldi'];
const INSTR=[
 {s:'VUSA',n:'Vanguard S&P 500',usd:'VOO',ocf:.07,px:78.4,cls:'US equity',bm:'S&P 500'},
 {s:'VWRL',n:'Vanguard FTSE All-World',usd:'VT',ocf:.22,px:112.6,cls:'Global equity',bm:'FTSE All-World'},
 {s:'IUSA',n:'iShares Core S&P 500',usd:'IVV',ocf:.07,px:74.1,cls:'US equity',bm:'S&P 500'},
 {s:'VUKE',n:'Vanguard FTSE 100',usd:'ISF.L',ocf:.09,px:34.2,cls:'UK equity',bm:'FTSE 100'},
 {s:'EQQQ',n:'Invesco Nasdaq 100',usd:'QQQ',ocf:.30,px:64.8,cls:'US tech',bm:'Nasdaq 100'},
 {s:'VFEM',n:'Vanguard Emerging Mkts',usd:'VWO',ocf:.22,px:42.9,cls:'EM equity',bm:'FTSE EM'},
 {s:'IWDG',n:'iShares Global Govt Bond',usd:'IGOV',ocf:.20,px:58.3,cls:'Bonds',bm:'FTSE WGBI'},
 {s:'VUAG',n:'Vanguard US Equity Index',usd:'VFIAX',ocf:.06,px:88.7,cls:'US equity',bm:'S&P 500'},
 {s:'CSPX',n:'iShares Core S&P 500 Acc',usd:'IVV',ocf:.07,px:74.1,cls:'US equity',bm:'S&P 500'},
 {s:'ISF',n:'iShares Core FTSE 100',usd:'ISF.L',ocf:.07,px:8.1,cls:'UK equity',bm:'FTSE 100'},
 {s:'VJPN',n:'Vanguard Japan Stock',usd:'EWJ',ocf:.22,px:51.4,cls:'Japan equity',bm:'TOPIX'},
 {s:'VERX',n:'Vanguard Europe ex-UK',usd:'VGK',ocf:.22,px:63.7,cls:'Europe equity',bm:'FTSE Dev Eur'},
 {s:'IGLN',n:'iShares Physical Gold',usd:'IAU',ocf:.12,px:44.2,cls:'Commodity',bm:'LBMA Gold'},
 {s:'VRP',n:'Vanguard Global REIT',usd:'VNQ',ocf:.22,px:52.6,cls:'Property',bm:'FTSE EPRA'}
];
const W=[.215,.145,.13,.09,.085,.07,.075,.055,.04,.035,.03,.015,.012,.013];
const S={scr:'home',stack:[],st:null,px:{},fx:1.2712,fxAt:0,backoff:0,budget:0,locked:true,q:'',o:{},otp:null,lim:60,homeTab:'ov'};
const MAIN=document.getElementById('main');
const $=s=>document.querySelector(s);
const fmt=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'});
const M=x=>fmt.format(x||0);
const D=d=>new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const T=d=>new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const now=()=>Date.now();
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0)/4294967296}
function live(m){const l=$('#live');l.textContent='';setTimeout(()=>l.textContent=m,40)}
function toast(m,ms=2400){const t=document.createElement('div');t.className='toast';t.textContent=m;document.getElementById('phone').appendChild(t);setTimeout(()=>t.remove(),ms)}
function lonParts(d=new Date()){
  const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',weekday:'short',hour:'2-digit',minute:'2-digit',year:'numeric',month:'2-digit',day:'2-digit',hour12:false}).formatToParts(d);
  const g=k=>f.find(p=>p.type===k)?.value;
  return{y:+g('year'),mo:+g('month'),da:+g('day'),hr:+g('hour')%24,mi:+g('minute'),wd:g('weekday')};
}
const iso=p=>`${p.y}-${String(p.mo).padStart(2,'0')}-${String(p.da).padStart(2,'0')}`;
function isOpen(d=new Date()){
  const p=lonParts(d); if(p.wd==='Sat'||p.wd==='Sun')return false;
  if(BH.includes(iso(p)))return false;
  const m=p.hr*60+p.mi; return m>=480&&m<990;
}
function nextOpen(d=new Date()){let t=new Date(d);t.setSeconds(0,0);for(let i=0;i<400;i++){if(isOpen(t))return t;t=new Date(t.getTime()+60000)}return t}
function monthStarts(from,to){const out=[];const d=new Date(from);d.setDate(1);d.setHours(9,0,0,0);if(d<=from)d.setMonth(d.getMonth()+1);while(d<=to){out.push(new Date(d));d.setMonth(d.getMonth()+1)}return out}
function dayIdx(d=new Date()){return Math.floor(d.getTime()/864e5)}
function pxOf(s){
  const p=S.px[s]; if(p)return p;
  const i=INSTR.find(x=>x.s===s); if(!i)return{p:0,sim:true,at:0};
  const seed=hash(s+'|'+dayIdx());
  return(S.px[s]={p:i.px*(1+(seed-.5)*.012),sim:true,at:0});
}
function total(){let t=0;for(const s in S.st.holdings){const q=S.st.holdings[s]?.q;if(q>0)t+=q*pxOf(s).p}return t+S.st.cash+(S.st.adj||0)}
function cost(){let t=0;for(const s in S.st.holdings){const h=S.st.holdings[s];if(h)t+=h.cost}return t}
function anchor(){let h=0;for(const s in S.st.holdings){const q=S.st.holdings[s]?.q;if(q>0)h+=q*pxOf(s).p}S.st.adj=TARGET-(h+S.st.cash)}
function blank(){
  return{v:V,seedv:SEEDV,profile:{name:'Jason Armstrong',email:'jason.armstrong@example.co.uk',phone:'+44 7700 900412',addr:'14 Bracken Way, Bristol, BS8 3QT',dob:'1986-04-17',ni:'QQ 12 34 56 C'},
   cash:12480,holdings:{},adj:0,orders:[],tx:[],pockets:[],rules:[],notifs:[],alerts:[],subs:[],devices:[],banks:[],payees:[],docs:[],chat:[],watch:[],taxpacks:[],
   pin:{hash:'',salt:'',tries:0,lock:0},cred:null,settings:{theme:'system',idle:5,bio:false},
   lastFee:0,lastDiv:0,open:{d:'',v:0},kyc:{step:0,done:false},hist:{years:[],months:[]},seen:now()};
}
function normalise(o){
  const b=blank(); const st=Object.assign(b,o);
  st.v=V;
  st.profile=Object.assign(b.profile,o.profile||{});
  st.settings=Object.assign(b.settings,o.settings||{});
  st.pin=Object.assign(b.pin,o.pin||{});
  st.open=Object.assign(b.open,o.open||{});
  st.kyc=Object.assign(b.kyc,o.kyc||{});
  ['orders','tx','pockets','rules','notifs','alerts','subs','devices','banks','payees','docs','chat','watch','taxpacks'].forEach(k=>{if(!Array.isArray(st[k]))st[k]=[]});
  if(!st.holdings||typeof st.holdings!=='object')st.holdings={};
  return st;
}
function migrate(){
  for(const k of OLDS){
    try{const raw=localStorage.getItem(k);if(!raw)continue;const o=JSON.parse(raw);if(o&&o.holdings)return normalise(o)}catch(e){}
  }
  return null;
}
function load(){
  let raw=null;
  try{
    raw=localStorage.getItem(KEY)||localStorage.getItem('plum_v12');
    if(!raw){const m=migrate();if(m){S.st=m;seedIfEmpty();save();return}S.st=blank();seedIfEmpty();save();return}
    const o=JSON.parse(raw);
    if(!o||typeof o!=='object')throw 0;
    S.st=normalise(o); seedIfEmpty();
  }catch(e){
    try{localStorage.setItem(KEY+'_corrupt',raw||'')}catch(_){}
    S.st=blank(); seedIfEmpty(); save();
    setTimeout(()=>toast('Saved data was unreadable — restored a clean copy, backup kept.'),700);
  }
}
let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S.st))}catch(e){toast('Storage full — changes may not persist')}},120)}
function limitFor(y){if(y<1999)return 9000;if(y<2008)return 7000;if(y<2011)return 10680;if(y<2013)return 11280;if(y<2014)return 11528;if(y<2015)return 11880;if(y<2017)return 15240;return 20000}
function seedIfEmpty(){
  if(S.st.hist.years.length)return;
  let v=0;const years=[];
  for(let y=1992;y<=2025;y++){
    const lim=limitFor(y),contrib=Math.min(lim,2400+(y-1992)*380);
    const g=(hash('g'+y)-.42)*.28+(y<2000?.11:y<2009?.02:.07);
    v=Math.max(0,(v+contrib)*(1+g));
    years.push({y,v,contrib:Math.round(contrib),g});
  }
  const scale=TARGET/years[years.length-1].v;
  years.forEach(o=>o.v=o.v*scale);
  S.st.hist.years=years;
  const months=[],start=new Date('2019-01-01');
  for(let i=0;i<84;i++){
    const d=new Date(start);d.setMonth(d.getMonth()+i);
    const t=years.find(o=>o.y===d.getFullYear());
    months.push({m:d.toISOString().slice(0,7),v:(t?t.v:TARGET)*(1+(hash('m'+i)-.5)*.05)});
  }
  S.st.hist.months=months;
  const holdVal=TARGET-S.st.cash;
  INSTR.forEach((ins,i)=>{
    const val=holdVal*W[i];
    S.st.holdings[ins.s]={q:+(val/ins.px).toFixed(4),cost:+(val/2.5431).toFixed(2)};
  });
  S.st.open={d:new Date().toDateString(),v:TARGET};
  S.st.lastFee=new Date(new Date().getFullYear(),new Date().getMonth(),1).getTime();
  S.st.lastDiv=now()-864e5*40;
  S.st.pockets=[
    {id:uid(),n:'Emergency fund',bal:8400,goal:15000,rule:'£200/week'},
    {id:uid(),n:'Japan 2026',bal:3120,goal:6000,rule:'Round-ups'},
    {id:uid(),n:'New kitchen',bal:1860,goal:12000,rule:'£150/month'}
  ];
  S.st.devices=[{id:uid(),n:'Samsung Galaxy S24 Ultra',os:'Android 15',at:now()-864e5*2,cur:true}];
  S.st.banks=[{id:uid(),n:'Monzo',last4:'8842',bal:2410}];
  S.st.subs=[{id:uid(),n:'Plum Plus',amt:FEE_M,cyc:'monthly',act:true}];
  S.st.alerts=[{id:uid(),n:'Price alert · VUSA',kind:'price',s:'VUSA',v:82,act:true}];
}
function seedTx(){
  const out=[],funds=INSTR.map(i=>i.s),Y=S.st.hist.years,t0=now();
  const pick=s=>funds[Math.floor(hash(s)*funds.length)%funds.length];
  const push=(d,t,a,n,cat)=>{const ms=d.getTime();if(ms>t0)return;out.push({id:uid(),t,a,d:ms,n,cat})};
  Y.forEach(o=>{
    const y=o.y;
    if(y<1999){
      const d=new Date(y,3+Math.floor(hash('d'+y)*3),3+Math.floor(hash('e'+y)*24),10,15);
      push(d,'in',o.contrib,'TESSA contribution','Contribution');
      push(new Date(d.getTime()+6e5),'out',+(o.contrib*.94).toFixed(2),`TESSA buy · ${pick('t'+y)}`,'Buy');
      if(y>=1994)push(new Date(y,10,12,11,0),'in',+(o.v*.0011).toFixed(2),`Interest · ${pick('z'+y)}`,'Income');
    }else{

function pdf(lines){
  const e=s=>String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/£/g,'\\243').replace(/–/g,'\\226').replace(/—/g,'\\227').replace(/’/g,'\\222').replace(/[^\x00-\xFF]/g,'?');
  let c='BT /F1 9 Tf 13 TL 40 800 Td\n';
  for(const l of lines.slice(0,58))c+=`(${e(l)}) Tj T*\n`;
  c+='ET';
  const o=[];
  o[1]='<< /Type /Catalog /Pages 2 0 R >>';
  o[2]='<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
  o[3]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>';
  o[4]=`<< /Length ${c.length} >>\nstream\n${c}\nendstream`;
  o[5]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';
  let out='%PDF-1.4\n';const off=[];
  for(let i=1;i<=5;i++){off[i]=out.length;out+=`${i} 0 obj\n${o[i]}\nendobj\n`}
  const x=out.length;
  out+='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++)out+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  out+=`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  return new Blob([out],{type:'application/pdf'});
}

function checkOrders(){
  const t=now();
  S.st.orders.filter(o=>o.status==='pending'||o.status==='queued').forEach(o=>{
    const px=pxOf(o.s).p;
    if(o.status==='queued'){if(navigator.onLine)o.status='pending';return}
    if(o.type==='market'){if(t>=o.fillAt)fill(o,px*(o.side==='buy'?1.0008:.9992));return}
    if(o.type==='limit'){
      if(o.side==='buy'&&px<=o.limit)return fill(o,o.limit);
      if(o.side==='sell'&&px>=o.limit)return fill(o,o.limit);
      if(t>o.exp)reject(o,'Limit not reached before expiry');

    }
    if(o.type==='stop'){if(px<=o.stop)return fill(o,px);if(t>o.exp)reject(o,'Stop not triggered before expiry')}
  });

function fill(o,px){
  const g=o.qty*px;
  if(o.side==='buy'&&g>S.st.cash)return reject(o,'Insufficient cash at fill');
  if(o.side==='buy'){S.st.cash-=g;const h=S.st.holdings[o.s]||{q:0,cost:0};h.q+=o.qty;h.cost+=g;S.st.holdings[o.s]=h}
  else{
    const h=S.st.holdings[o.s];
    if(!h||h.q<o.qty-1e-6)return reject(o,'Not enough units to sell');
    const before=h.q;h.q-=o.qty;h.cost=Math.max(0,h.cost*(1-o.qty/before));S.st.cash+=g;
    if(h.q<1e-4)delete S.st.holdings[o.s];
  }
  o.status='filled';o.filledAt=now();o.fillPx=px;
  ledger(o.side==='buy'?'out':'in',g,`${o.side==='buy'?'Buy':'Sell'} ${o.qty.toFixed(4)} ${o.s}`,o.side==='buy'?'Buy':'Sell');
  notify('Order filled',`${o.qty.toFixed(4)} ${o.s} at ${M(px)}`);
  anchor();save();
}

    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  });
  wrap.addEventListener('click',e=>{if(e.target===wrap)close()});
  return wrap;
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,s=el.dataset.s,id=el.dataset.id;
  const stop=()=>{e.preventDefault();e.stopPropagation()};
  switch(a){
    case 'go':stop();go(s,{q:el.dataset.q!==undefined?el.dataset.q:''});break;
    case 'back':stop();back();break;
    case 'htab':stop();S.homeTab=el.dataset.t;render();break;
    case 'filter':stop();S.q=el.dataset.c;S.lim=60;render();break;
    case 'more':stop();S.lim=(S.lim||60)+60;render();break;
    case 'otype':stop();S.o.type=el.dataset.t;render();break;
    case 'opct':{
      stop();const px=pxOf(S.q).p;
      const max=S.o.side==='buy'?S.st.cash/px:(S.st.holdings[S.q]?.q||0);
      S.o.qty=+(max*(+el.dataset.p)/100).toFixed(4);render();break;}
    case 'order':stop();S.o={side:el.dataset.side,s:el.dataset.s,qty:0,type:'market'};go('order');break;
    case 'sellall':{stop();const h=S.st.holdings[el.dataset.s];
      if(h){S.o={side:'sell',s:el.dataset.s,qty:+h.q.toFixed(4),type:'market'};go('order')}break;}
    case 'oreview':{
      stop();const err=$('#oerr');
      if(!S.o.qty||S.o.qty<=0)return err.textContent='Enter an amount';
      if(S.o.type!=='market'&&(!S.o.lvl||+S.o.lvl<=0))return err.textContent='Enter a trigger price';
      if(S.o.side==='buy'&&S.o.qty*pxOf(S.o.s).p>S.st.cash)return err.textContent='Not enough cash';
      if(S.o.side==='sell'&&S.o.qty>(S.st.holdings[S.o.s]?.q||0)+1e-6)return err.textContent='Not enough units';
      go('review');break;}
    case 'oconfirm':{
      stop();
      if(S.st.settings.bio&&S.st.cred){const ok=await tryBio();if(!ok)return toast('Fingerprint not recognised')}
      const o={id:uid().toUpperCase().slice(0,8),s:S.o.s,side:S.o.side,qty:S.o.qty,type:S.o.type,
        limit:S.o.type==='limit'?+S.o.lvl:undefined,stop:S.o.type==='stop'?+S.o.lvl:undefined,
        at:now(),status:navigator.onLine?'pending':'queued',fillAt:nextOpen().getTime(),exp:now()+864e5*30};
      if(o.type!=='market')o.fillAt=now();
      S.st.orders.unshift(o);
      notify('Order placed',`${o.side==='buy'?'Buy':'Sell'} ${o.qty.toFixed(4)} ${o.s}`);
      save();go('receipt',{q:o.id},true);break;}
    case 'undo':{
      stop();const o=S.st.orders.find(x=>x.id===id);
      if(o&&(o.status==='pending'||o.status==='queued')){o.status='cancelled';notify('Order cancelled',`${o.s} cancelled`);save();toast('Order cancelled');go('portfolio')}
      break;}
    case 'alert':{
      stop();const p=pxOf(s).p;
      S.st.alerts.unshift({id:uid(),n:`Price alert · ${s}`,kind:'price',s,v:+(p*1.05).toFixed(2),act:true});
      save();toast('Alert set 5% above price');break;}
    case 'watch':{
      stop();
      if(S.st.watch.includes(s))S.st.watch=S.st.watch.filter(x=>x!==s);else S.st.watch.push(s);
      save();render();break;}
    case 'pnew':{stop();const n=prompt('Pocket name');if(!n)return;
      S.st.pockets.push({id:uid(),n,bal:0,goal:1000,rule:'Manual'});save();render();break;}
    case 'padd':{stop();const p=S.st.pockets.find(x=>x.id===id);const v=+(prompt('Amount to add','50')||0);
      if(!p||!v||v>S.st.cash)return toast('Check the amount');
      S.st.cash-=v;p.bal+=v;ledger('out',v,`To pocket · ${p.n}`,'Pocket');save();render();break;}
    case 'pdel':{stop();const p=S.st.pockets.find(x=>x.id===id);if(!p)return;
      S.st.cash+=p.bal;ledger('in',p.bal,`Closed pocket · ${p.n}`,'Pocket');
      S.st.pockets=S.st.pockets.filter(x=>x.id!==id);save();render();break;}
    case 'rtoggle':{stop();const r=S.st.rules.find(x=>x.id===id);if(r){r.act=!r.act;save();render()}break;}
    case 'rnew':{stop();const n=prompt('Rule name','Round up spare change');if(!n)return;
      S.st.rules.push({id:uid(),n,d:'Every purchase',act:true});save();render();break;}
    case 'mconfirm':{
      stop();const v=+(document.getElementById('amt').value||0),to=document.getElementById('to').value,err=$('#merr');
      if(!v||v<=0)return err.textContent='Enter an amount';
      if(v>S.st.cash)return err.textContent='Not enough cash';
      S.st.cash-=v;
      if(to==='cash')ledger('in',v,'To main cash','Move');
      else{const p=S.st.pockets.find(x=>x.id===to);if(p){p.bal+=v;ledger('out',v,`To pocket · ${p.n}`,'Pocket')}}
      save();toast('Moved');back();break;}
    case 'topup':{
      stop();const v=+(prompt('Amount from bank','250')||0);if(!v||v<=0)return;
      if(usedAllow()+v>20000)return toast('That exceeds your £20,000 allowance');
      S.st.cash+=v;ledger('in',v,'From linked bank','Contribution');save();toast(`${M(v)} added`);render();break;}
    case 'withdraw':{
      stop();const v=+(prompt('Amount to bank',String(Math.min(500,Math.floor(S.st.cash))))||0);
      if(!v||v<=0)return;
      if(v>S.st.cash)return toast('Not enough cash');
      S.st.cash-=v;ledger('out',v,'To linked bank','Withdrawal');save();toast('Sent — 1–2 working days');render();break;}
    case 'psave':{
      stop();
      ['name','email','phone','addr','dob','ni'].forEach(k=>{const i=document.getElementById('f_'+k);if(i)S.st.profile[k]=i.value.trim()});
      save();toast('Saved');back();break;}
    case 'badd':{
      stop();S.st.banks.push({id:uid(),n:document.getElementById('bn').value,last4:document.getElementById('bl').value.padStart(4,'0'),bal:0});
      save();render();break;}
    case 'bdel':{stop();S.st.banks=S.st.banks.filter(x=>x.id!==id);save();render();break;}
    case 'paddp':{
      stop();
      const n=document.getElementById('pn').value.trim(),sc=document.getElementById('psc').value.replace(/\D/g,'').padEnd(6,'0').slice(0,6),ac=document.getElementById('pac').value.replace(/\D/g,'');
      const bad=validSC(sc,ac)||(!n?'Enter a name':'');
      if(bad)return $('#perr').textContent=bad;
      const code=String(Math.floor(100000+Math.random()*900000));
      S.otp={code,payee:{n,sc,ac}};
      const sh=sheet(`<h3>Verify new payee</h3><p class="s mut" style="margin:8px 0 14px">We sent a code to ${esc(S.st.profile.phone)}. Demo code: <b>${code}</b></p>
        <div class="fld"><label for="otp">6-digit code</label><input id="otp" inputmode="numeric" maxlength="6"></div>
        <div id="otperr" class="err"></div><button class="btn" data-act="otpconfirm">Confirm</button>`);
      setTimeout(()=>sh.querySelector('#otp')?.focus(),80);
      break;}
    case 'otpconfirm':{
      stop();const v=$('#otp')?.value||'';
      if(v!==S.otp?.code)return $('#otperr').textContent='Wrong code';
      S.st.payees.push({id:uid(),...S.otp.payee,cool:now()+120000});
      S.otp=null;save();document.querySelector('.sheet')?.remove();toast('Payee added');render();break;}
    case 'pdelp':{stop();S.st.payees=S.st.payees.filter(x=>x.id!==id);save();render();break;}
    case 'dgen':{
      stop();const months=+document.getElementById('dr').value,cut=now()-months*30*864e5;
      const rows=S.st.tx.filter(t=>t.d>=cut);
      const lines=['PLUM — STATEMENT',`Account: ${S.st.profile.name}`,`Period: last ${months} month(s)`,`Generated: ${D(now())}`,'',
        'Date       Description                       Amount','─'.repeat(56),
        ...rows.map(t=>`${D(t.d).padEnd(11)}${t.n.slice(0,32).padEnd(33)}${(t.t==='in'?'+':'-')}${t.a.toFixed(2)}`),
        '─'.repeat(56),`Closing value: ${M(total())}`,'','Capital at risk. Fictional demonstration account.'];
      await sharePdf(lines,`plum-statement-${months}m.pdf`);
      S.st.docs.unshift({id:uid(),n:`Statement · last ${months} month(s)`,at:now(),lines});save();render();break;}
    case 'dgentax':{
      stop();
      const y=new Date().getFullYear();
      const contrib=S.st.tx.filter(t=>t.cat==='Contribution'&&new Date(t.d).getFullYear()===y).reduce((a,b)=>a+b.a,0);
      const divs=S.st.tx.filter(t=>t.cat==='Income'&&new Date(t.d).getFullYear()===y).reduce((a,b)=>a+b.a,0);
      const fees=S.st.tx.filter(t=>t.cat==='Fees'&&new Date(t.d).getFullYear()===y).reduce((a,b)=>a+b.a,0);
      const lines=['PLUM — TAX PACK',`Account: ${S.st.profile.name}`,`Tax year: ${taxYear()}`,`Generated: ${D(now())}`,'',
        `ISA contributions: ${M(contrib)}`,`Allowance remaining: ${M(Math.max(0,20000-contrib))}`,
        `Dividends received: ${M(divs)}`,`Charges paid: ${M(fees)}`,`Portfolio value: ${M(total())}`,
        `Unrealised gain: ${M(total()-cost())}`,'',
        'All figures in GBP. ISA growth is free of UK income and capital gains tax.',
        'Not tax advice. Fictional demonstration account.'];
      await sharePdf(lines,`plum-taxpack-${taxYear().replace('/','-')}.pdf`);
      S.st.taxpacks.unshift({id:uid(),n:`Tax pack ${taxYear()}`,at:now(),lines});save();render();break;}
    case 'dshare':{stop();const d=S.st.docs.find(x=>x.id===id)||S.st.taxpacks.find(x=>x.id===id);
      if(!d)return;await sharePdf(d.lines||[d.n],`${d.n.replace(/\W+/g,'-')}.pdf`);break;}
    case 'dgenlegal':{
      stop();await sharePdf(['PLUM — TERMS AND KEY FEATURES','','This is a stocks and shares ISA. Capital at risk.',
        'Annual allowance £20,000. Flexible withdrawals.',`Platform fee ${(PLAT*100).toFixed(2)}% a year plus ${M(FEE_M)} monthly plan fee.`,
        'Fund OCFs range 0.06% to 0.30%.','FSCS protection up to £85,000 for investment claims.','',
        'Fictional demonstration. Not a real Plum account.'],'plum-terms.pdf');break;}
    case 'asknotif':stop();askNotif();break;
    case 'nread':{stop();const n=S.st.notifs.find(x=>x.id===id);if(n){n.read=true;save();render()}break;}
    case 'nclear':{stop();S.st.notifs=[];save();render();break;}
    case 'stoggle':{stop();const x=S.st.subs.find(y=>y.id===id);if(x){x.act=!x.act;save();render()}break;}
    case 'sadd':{stop();const v=+document.getElementById('sa').value;
      if(!v)return;S.st.subs.push({id:uid(),n:document.getElementById('sn').value,amt:v,cyc:'monthly',act:true});save();render();break;}
    case 'atoggle':{stop();const x=S.st.alerts.find(y=>y.id===id);if(x){x.act=!x.act;x.fired=false;save();render()}break;}
    case 'biotoggle':stop();if(S.st.cred){S.st.cred=null;S.st.settings.bio=false;save();toast('Fingerprint removed');render()}else enrolBio();break;
    case 'pinremove':stop();S.st.pin={hash:'',salt:'',tries:0,lock:0};save();toast('PIN removed');render();break;
    case 'pinsave':{
      stop();const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value,err=$('#pinerr');
      if(!/^\d{6}$/.test(p1))return err.textContent='PIN must be 6 digits';
      if(p1!==p2)return err.textContent='PINs do not match';
      const salt=uid();S.st.pin={hash:await pbkdf2(p1,salt),salt,tries:0,lock:0};
      save();toast('PIN set');back();break;}
    case 'unlockbio':{
      stop();const ok=await tryBio();
      if(ok){S.locked=false;S.scr='home';render()}else toast('Not recognised — use your PIN');break;}
    case 'skiplock':stop();S.locked=false;S.scr='home';render();break;
    case 'drev':{stop();S.st.devices=S.st.devices.filter(x=>x.id!==id);save();render();break;}
    case 'knext':{
      stop();const k=S.st.kyc;
      if(k.step===1&&k.exp===undefined)return toast('Pick an option');
      if(k.step===2&&!k.risk)return toast('Accept the risk to continue');
      if(k.step>=2){k.done=true;save();toast('Account set up');go('home');return}
      k.step++;save();render();break;}
    case 'kback':{stop();S.st.kyc.step=Math.max(0,(S.st.kyc.step||0)-1);save();render();break;}
    case 'kset':{stop();const v=+el.dataset.v;
      if(S.st.kyc.step===1)S.st.kyc.exp=v;else S.st.kyc.risk=!S.st.kyc.risk;
      save();render();break;}
    case 'chatsend':{
      stop();const i=$('#cm'),m=i.value.trim();if(!m)return;
      S.st.chat.push({me:true,m});i.value='';save();render();
      setTimeout(()=>{
        const r=/isa|allowance/i.test(m)?`Your remaining ISA allowance is ${M(Math.max(0,20000-usedAllow()))} for ${taxYear()}.`
          :/fee|charge/i.test(m)?`Plum Plus is ${M(FEE_M)} a month plus ${(PLAT*100).toFixed(2)}% platform fee.`
          :/withdraw/i.test(m)?'Withdrawals take 1–2 working days and can be replaced in the same tax year.'
          :'Thanks — a human will pick this up. Most answers are in Terms & key features.';
        S.st.chat.push({me:false,m:r});save();if(S.scr==='chat')render();
      },900);break;}
    case 'install':{
      stop();
      if(S.installEv){S.installEv.prompt();S.installEv=null}
      else{const el2=$('#ierr');if(el2)el2.textContent='Use Chrome ⋮ → Add to Home screen.';toast('Use Chrome menu → Add to Home screen')}
      break;}
    case 'export':{
      stop();const b=new Blob([JSON.stringify(S.st)],{type:'application/json'});
      const u=URL.createObjectURL(b);const a2=document.createElement('a');a2.href=u;a2.download='plum-data.json';a2.click();
      setTimeout(()=>URL.revokeObjectURL(u),3000);break;}
    case 'import':{
      stop();const inp=document.createElement('input');inp.type='file';inp.accept='application/json';
      inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
        r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.holdings)throw 0;localStorage.setItem(KEY,JSON.stringify(o));location.reload()}catch(e){toast('That file is not valid Plum data')}};
        r.readAsText(f)};inp.click();break;}
  }
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='oqty')S.o.qty=+el.value;
  if(a==='olvl')S.o.lvl=el.value;
  if(a==='ssearch'){S.q=el.value;const t=MAIN.scrollTop;render();MAIN.scrollTop=t;
    const i=MAIN.querySelector('[data-act="ssearch"]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
  if(a==='lockpin'&&el.value.length===6)doPin(el.value);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='cm')document.querySelector('[data-act="chatsend"]')?.click();
  if(e.key==='Enter'&&e.target.dataset.act==='lockpin')doPin(e.target.value);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='theme'){S.st.settings.theme=el.value;save();render()}
  if(el.dataset.act==='idle'){S.st.settings.idle=+el.value;save()}
});
async function doPin(v){
  const p=S.st.pin;
  if(p.lock>now())return;
  if(await pbkdf2(v,p.salt)===p.hash){S.locked=false;p.tries=0;save();S.scr='home';render()}
  else{p.tries++;if(p.tries>=5){p.lock=now()+60000;p.tries=0;toast('Too many attempts — locked 60s')}else toast(`Wrong PIN · ${5-p.tries} left`);save();render()}
}
let idleT=0;
['pointerdown','keydown','scroll'].forEach(ev=>document.addEventListener(ev,()=>{
  clearTimeout(idleT);
  idleT=setTimeout(()=>{if(S.st.pin.hash||S.st.cred){S.locked=true;S.scr='lock';render()}},(S.st.settings.idle||5)*60000);
},{passive:true}));
function regSW(){
  if(!('serviceWorker' in navigator)||!location.protocol.startsWith('http'))return;
  navigator.serviceWorker.register('sw.js').then(r=>{
    if('periodicSync' in r)r.periodicSync.register('plum-nudge',{minInterval:900000}).catch(()=>{});
    r.addEventListener('updatefound',()=>{
      const w=r.installing;if(!w)return;
      w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdate()});
    });
  }).catch(()=>{});
}
function showUpdate(){
  const d=document.createElement('div');d.className='toast';
  d.innerHTML='New version ready <b style="margin-left:8px;text-decoration:underline;cursor:pointer" id="upd">Reload</b>';
  document.getElementById('phone').appendChild(d);
  d.querySelector('#upd').onclick=()=>{navigator.serviceWorker.getRegistration().then(r=>r&&r.waiting&&r.waiting.postMessage('skip'));location.reload()};
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEv=e});
window.addEventListener('online',()=>{toast('Back online');poll()});
window.addEventListener('offline',()=>toast('Offline — orders will queue'));
load();
if(!S.st.cred&&!S.st.pin.hash)S.locked=false;
if((S.st.seedv||0)<SEEDV){seedTx();seedRecent();S.st.seedv=SEEDV;save()}
if(!S.st.open||S.st.open.d!==new Date().toDateString())S.st.open={d:new Date().toDateString(),v:total()};
anchor();checkOrders();anchor();
history.replaceState({d:0},'');
render();regSW();
setInterval(tick,1000);
setInterval(()=>{if(!document.hidden)poll()},60000);
poll();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkOrders();poll()}});
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(KEY,JSON.stringify(S.st))}catch(e){}});
</script>
</body>
</html>
