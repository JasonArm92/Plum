function buildLedger(rnd,target){
  const rows=[];let bal=0;let d=new Date(1992,9,1);const end=new Date();end.setDate(1);
  while(d<=end){
    const y=d.getFullYear(),m=d.getMonth(),age=y-1992;
    let c;
    if(age<7)c=38+age*18;else if(age<14)c=165+(age-7)*32;else if(age<24)c=390+(age-14)*28;else if(age<32)c=700+(age-24)*65;else c=1260;
    c*=(0.85+rnd()*0.3);
    let mean=0.0049;
    if(y===2000&&m>=2)mean=-0.011; if(y===2001)mean=-0.0102; if(y===2002&&m<9)mean=-0.0091;
    if(y===2008&&m>=8)mean=-0.0225; if(y===2009&&m<3)mean=-0.0155;
    if(y===2020&&m===2)mean=-0.074; if(y===2020&&m===3)mean=0.044; if(y===2022&&m<10)mean=-0.0082;
    if(y===1997&&m>5)mean=0.0105; if(y===1999&&m<3)mean=0.0128;
    const r=mean+(rnd()-.5)*0.055;
    const opening=bal,div=opening*0.0018,mkt=opening*r,fee=opening*0.00031;
    const closing=Math.max(0,opening+c+div+mkt-fee);
    rows.push({ym:y+'-'+String(m+1).padStart(2,'0'),y,m,opening,contrib:c,div,mkt,fee,closing});
    bal=closing;d=new Date(y,m+1,1);
  }
  const scale=target/bal;let prev=0;
  for(const row of rows){
    row.opening=prev;
    row.contrib=+(row.contrib*scale).toFixed(2);row.div=+(row.div*scale).toFixed(2);
    row.mkt=+(row.mkt*scale).toFixed(2);row.fee=+(row.fee*scale).toFixed(2);
    row.closing=+(row.opening+row.contrib+row.div+row.mkt-row.fee).toFixed(2);prev=row.closing;
  }
  const last=rows[rows.length-1];
  last.mkt=+(last.mkt+(target-last.closing)).toFixed(2);last.closing=target;
  const split=new Date(2015,9,1);
  for(const row of rows){
    const dt=new Date(row.y,row.m,1);
    row.imported=dt<split;
    row.src=row.imported?SOURCES[(row.y*7+row.m)%SOURCES.length]:null;
    row.wrapper=row.y<1999||(row.y===1999&&row.m<3)?'PEP/TESSA':'ISA';
  }
  return rows;
}

const TX_DAYS=1100;
function buildHist(rnd){
  const rows=[];let bal=620;
  let d=new Date(2015,9,1);
  const s=new Date();s.setDate(s.getDate()-TX_DAYS);
  const end=new Date(s.getFullYear(),s.getMonth(),1);
  while(d<end){
    const ym=ymOf(d);
    const f=(d.getFullYear()-2015)+(d.getMonth()/12);
    const sal=Math.round(2680+f*32);
    const rent=rentFor(ym);
    const household=Math.round(980+f*22+(rnd()-.5)*160);
    const homeEd=ym>='2026-07';
    const kids=d.getFullYear()>=2018?Math.round((170+(d.getFullYear()-2018)*22)*(homeEd?0.85:1)+(rnd()-.5)*60):0;
    const side=projectFor(ym).reduce((s,p)=>s+p.a,0)+retainerFor(ym).reduce((s,r)=>s+r.a,0);
    const inc=sal+side+(d.getFullYear()>=2019?102.40:0);
    const out=household+kids+(rent?rent.a:0);
    bal=Math.max(-520,bal+inc-out);
    rows.push({ym,in:inc,out,closing:+bal.toFixed(2),rent:rent?rent.n:null});
    d=new Date(d.getFullYear(),d.getMonth()+1,1);
  }
  return rows;
}

function buildTx(rnd,startBal){
  const out=[];const today=new Date();today.setHours(0,0,0,0);
  const from=new Date(today);from.setDate(from.getDate()-TX_DAYS);let bal=startBal;
  const epoch=new Date(2019,0,4);
  for(let d=new Date(from);d<=today;d.setDate(d.getDate()+1)){
    const day=new Date(d),ym=ymOf(day);
    for(const m of MERCH){
      if(m.until&&ym>=m.until)continue;
      if(m.from&&ym<m.from)continue;
      if(rnd()<m.cad*0.24){
        const amt=+(m.lo[0]+rnd()*(m.lo[1]-m.lo[0])).toFixed(2);
        bal=+(bal-amt).toFixed(2);
        out.push({id:'t'+out.length+'_'+day.getTime(),d:dstr(day),t:day.getTime(),n:m.n,c:m.c,amt:-amt,bal,pend:rnd()<0.04});
      }
    }
    if(day.getDate()<=28)for(const b of BILLS) if(day.getDate()===b.day){
      bal=+(bal-b.a).toFixed(2);
      out.push({id:'b'+out.length+'_'+day.getTime(),d:dstr(day),t:day.getTime(),n:b.n,c:'Bills',amt:-b.a,bal,dd:true});
    }
    const r=rentFor(ym);
    if(r&&day.getDate()===r.day){
      bal=+(bal-r.a).toFixed(2);
      out.push({id:'r'+out.length+'_'+day.getTime(),d:dstr(day),t:day.getTime(),n:r.n,c:'Rent',amt:-r.a,bal,dd:true});
    }
    if(day.getDate()===3)for(const t of retainerFor(ym)){
      bal=+(bal+t.a).toFixed(2);
      out.push({id:'m'+out.length+'_'+day.getTime(),d:dstr(day),t:day.getTime(),n:t.n,c:'Income',amt:t.a,bal,maint:true});
    }
    if(day.getDate()===15)for(const p of projectFor(ym)){
      bal=+(bal+p.a).toFixed(2);
      out.push({id:'j'+out.length+'_'+day.getTime(),d:dstr(day),t:day.getTime(),n:p.n,c:'Income',amt:p.a,bal,proj:true});
    }
    if(Math.round((day-epoch)/864e5)%28===0){
      bal=+(bal+102.40).toFixed(2);
      out.push({id:'c'+day.getTime(),d:dstr(day),t:day.getTime(),n:'HMRC Child Benefit',c:'Income',amt:102.40,bal});
    }
    if(day.getDate()===28){
      const sal=2680+Math.round(rnd()*180);
      bal=+(bal+sal).toFixed(2);
      out.push({id:'s'+day.getTime(),d:dstr(day),t:day.getTime(),n:'Kingdom Services Group',c:'Income',amt:sal,bal,sal:true});
    }
  }
  return out.sort((a,b)=>b.t-a.t);
}

function deriveTargets(tx){
  const cut=Date.now()-90*864e5;
  const sums={};
  tx.filter(x=>x.amt<0&&x.t>=cut).forEach(x=>{sums[x.c]=(sums[x.c]||0)+(-x.amt)});
  const out={};
  Object.entries(sums).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{
    out[c]=Math.max(15,Math.round((v/3*1.05)/5)*5);
  });
  return out;
}

function lineChart(pts,w,h,opt={}){
  if(pts.length<2)return '<div class="empty">Not enough data</div>';
  const min=Math.min(...pts),max=Math.max(...pts),pad=(max-min)||1;

  const d=pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${opt.h||140}px" aria-hidden="true">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF4F40" stop-opacity=".3"/><stop offset="1" stop-color="#FF4F40" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#g1)"/><path d="${d}" fill="none" stroke="#FF4F40" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(pts.length-1)}" cy="${Y(pts[pts.length-1])}" r="4" fill="#FF4F40"/></svg>`;
}
function barChart(vals,labels,w,h){
  if(!vals.length)return '';
  const max=Math.max(...vals)||1,bw=w/vals.length;
  return `<svg class="chart" viewBox="0 0 ${w} ${h+18}" style="height:${h+18}px" aria-hidden="true">
    ${vals.map((v,i)=>`<rect x="${(i*bw+bw*.18).toFixed(1)}" y="${(h-(v/max)*h).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${Math.max(1,(v/max)*h).toFixed(1)}" rx="3" fill="${v===max?'#FF4F40':'currentColor'}" opacity="${v===max?1:.8}"/>`).join('')}
    ${labels.map((l,i)=>l?`<text class="axis" x="${(i*bw+bw/2).toFixed(1)}" y="${h+13}" text-anchor="middle">${esc(l)}</text>`:'').join('')}</svg>`;
}
function donut(data,w=150){
  const total=data.reduce((s,d)=>s+d.v,0)||1;let a=-Math.PI/2;
  const R=w/2,r=R*.62;
  const arcs=data.map(d=>{
    const ang=d.v/total*Math.PI*2,a2=a+ang;
    const p=(rad,an)=>[w/2+Math.cos(an)*rad,w/2+Math.sin(an)*rad];
    const [x1,y1]=p(R,a),[x2,y2]=p(R,a2),[x3,y3]=p(r,a2),[x4,y4]=p(r,a);
    const big=ang>Math.PI?1:0;a=a2;
    return `<path d="M${x1} ${y1} A${R} ${R} 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${big} 0 ${x4} ${y4} Z" fill="${d.c}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${w}" style="width:${w}px;height:${w}px" aria-hidden="true">${arcs}</svg>`;
}

function monthSpend(ym){
  const h=S.hist.find(r=>r.ym===ym);
  const t=S.tx.filter(x=>x.d.slice(0,7)===ym&&x.amt<0).reduce((s,x)=>s-x.amt,0);
  return (h?h.out:0)+t;
}
function spendSeries(range){
  const now=new Date();
  if(range==='week'||range==='month'){
    const n=range==='week'?7:30,vals=Array(n).fill(0),labels=Array(n).fill('');
    for(let i=0;i<n;i++){
      const d=new Date();d.setDate(d.getDate()-(n-1-i));
      vals[i]=S.tx.filter(t=>t.d===dstr(d)&&t.amt<0).reduce((s,t)=>s-t.amt,0);
      labels[i]=range==='week'?['S','M','T','W','T','F','S'][d.getDay()]:(i%5===0?String(d.getDate()):'');
    }
    return {vals,labels};
  }
  if(range==='year'){
    const vals=Array(12).fill(0),labels=Array(12).fill('');
    for(let i=0;i<12;i++){
      const d=new Date(now.getFullYear(),now.getMonth()-(11-i),1);
      vals[i]=monthSpend(ymOf(d));labels[i]=MON[d.getMonth()];
    }
    return {vals,labels};
  }
  const y0=2015,y1=now.getFullYear(),vals=[],labels=[];
  for(let y=y0;y<=y1;y++){
    const h=S.hist.filter(r=>r.ym.slice(0,4)===String(y)).reduce((s,r)=>s+r.out,0);
    const t=S.tx.filter(x=>x.d.slice(0,4)===String(y)&&x.amt<0).reduce((s,x)=>s-x.amt,0);
    vals.push(h+t);labels.push(String(y).slice(2));
  }
  return {vals,labels};
}
function balanceSeries(range){
  const now=new Date();
  if(range==='week'||range==='month'){
    const n=range==='week'?7:30,out=[];
    for(let i=n-1;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);
      const hit=S.tx.find(t=>t.d===dstr(d));
      out.push(hit?hit.bal:(out.length?out[out.length-1]:S.acct.current));
    }
    return out;
  }
  const months=S.hist.map(h=>h.closing);
  const byMonth={};
  S.tx.slice().reverse().forEach(t=>{byMonth[t.d.slice(0,7)]=t.bal});
  Object.keys(byMonth).sort().forEach(k=>months.push(byMonth[k]));
  if(range==='year')return months.slice(-12);
  return months.slice(-132);
}

async function toggleBio(){
  if(S.sec.bio){
    if(S.sec.credId&&window.PublicKeyCredential){
      try{const ok=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        if(ok){S.sec.bio=false;S.sec.credId=null;save();render();toast('Fingerprint off');return}}catch(e){}
    }
    S.sec.bio=false;S.sec.credId=null;save();render();toast('Fingerprint off');return;
  }
  try{await bioEnrol();S.sec.bio=true;save();render();toast('Fingerprint enabled')}
  catch(e){S.sec.bio=false;save();render();toast('Could not enrol this device')}
}

let deferred=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
async function installApp(){
  if(deferred){deferred.prompt();const r=await deferred.userChoice;deferred=null;toast(r.outcome==='accepted'?'Installing…':'Install dismissed');return}
  if(STANDALONE){toast('Already installed');return}
  toast('Open the browser menu and choose “Add to Home screen”');
}
function isaAdd(){
  const used=tyUsed(),lim=ISA_LIMITS[taxYear()]||20000,room=lim-used;
  if(room<=0){toast('Allowance used for '+tyLabel(taxYear()));return}
  sheet(`<h2>Add to ISA</h2><p class="small muted">${tyLabel(taxYear())} allowance: ${gbp(used)} used of ${gbp(lim)}. ${gbp(room)} remaining.</p>
    <label class="f">Amount</label><input id="isaAmt" type="number" inputmode="decimal" placeholder="0.00"/>
    <div style="display:flex;gap:8px;margin-top:10px">${[100,500,1000].map(v=>`<button class="badge" onclick="document.getElementById('isaAmt').value=${v}">${gbp0(v)}</button>`).join('')}<button class="badge" onclick="document.getElementById('isaAmt').value=${room.toFixed(2)}">Max</button></div>
    <button class="btn" style="margin-top:16px" onclick="doIsaAdd(${room})">Add</button>`);
}
function doIsaAdd(room){
  let v=parseFloat($('#isaAmt').value||'0');
  if(!(v>0)){toast('Enter an amount');return}
  if(v>room){v=room;toast('Capped at remaining allowance')}
  if(v>S.acct.current){toast('Not enough in current account');return}
  S.acct.current=+(S.acct.current-v).toFixed(2);S.acct.isaCash=+(S.acct.isaCash+v).toFixed(2);
  const last=S.ledger.isa[S.ledger.isa.length-1];
  last.contrib=+(last.contrib+v).toFixed(2);last.closing=+(last.closing+v).toFixed(2);
  S.notifs.unshift({t:'ISA contribution',b:`${gbp(v)} added for ${tyLabel(taxYear())}`,d:'now',i:'ISA'});
  save();closeSheet();render();toast(`${gbp(v)} added to your ISA`);
}
function potMove(id,sign){
  const p=S.pots.find(x=>x.id===id);
  sheet(`<h2>${sign>0?'Add to':'Withdraw from'} ${esc(p.n)}</h2><label class="f">Amount</label>
    <input id="pmAmt" type="number" inputmode="decimal" placeholder="0.00"/>
    <button class="btn" style="margin-top:16px" onclick="doPotMove('${id}',${sign})">Confirm</button>`);
}
function doPotMove(id,sign){
  const p=S.pots.find(x=>x.id===id),v=parseFloat($('#pmAmt').value||'0');
  if(!(v>0)){toast('Enter an amount');return}
  if(sign>0&&v>S.acct.current){toast('Not enough available');return}
  if(sign<0&&v>p.a){toast('Not enough in pot');return}
  p.a=+(p.a+sign*v).toFixed(2);S.acct.current=+(S.acct.current-sign*v).toFixed(2);
  S.acct.savings=+S.pots.reduce((s,x)=>s+x.a,0).toFixed(2);
  save();closeSheet();render();toast(sign>0?`${gbp(v)} moved to ${p.n}`:`${gbp(v)} moved back`);
}

  sheet(`<h2>New pot</h2><label class="f">Name</label><input id="npName" placeholder="e.g. New car"/>
    <label class="f">Goal</label><input id="npGoal" type="number" inputmode="decimal" placeholder="0"/>
    <button class="btn" style="margin-top:16px" onclick="doNewPot()">Create</button>`);
}
function doNewPot(){
  const n=$('#npName').value.trim()||'New pot',g=parseFloat($('#npGoal').value||'500');
  S.pots.push({id:'p'+Date.now(),n,a:0,rate:2.80,goal:g,lock:null,ico:'🎯',col:'#7A5AF8'});
  save();closeSheet();render();toast('Pot created');
}
function archivePot(id){
  const p=S.pots.find(x=>x.id===id);
  if(p.a>0)S.acct.current=+(S.acct.current+p.a).toFixed(2);
  S.pots=S.pots.filter(x=>x.id!==id);S.acct.savings=+S.pots.reduce((s,x)=>s+x.a,0).toFixed(2);
  save();back();toast('Pot archived');
}
function odMove(sign){
  if(sign>0){
    const room=S.acct.odLimit-S.acct.odDrawn;if(room<=0){toast('At limit');return}
    const v=Math.min(100,room);S.acct.odDrawn=+(S.acct.odDrawn+v).toFixed(2);S.acct.current=+(S.acct.current+v).toFixed(2);toast(`${gbp(v)} drawn`);
  }else{
    if(S.acct.odDrawn<=0){toast('Nothing to repay');return}
    const v=Math.min(100,S.acct.odDrawn,S.acct.current);if(v<=0){toast('No funds');return}
    S.acct.odDrawn=+(S.acct.odDrawn-v).toFixed(2);S.acct.current=+(S.acct.current-v).toFixed(2);toast(`${gbp(v)} repaid`);
  }
  save();render();
}

    ${S.payees.map(p=>`<button class="row" style="width:100%;text-align:left" onclick="toast('Split request sent to ${esc(p.n)}');closeSheet()"><span class="ico">${esc(p.i)}</span><span class="t"><b>${esc(p.n)}</b></span></button>`).join('')}`);

function changePin(){sheet(`<h2>Change PIN</h2><input id="npin" inputmode="numeric" maxlength="4" placeholder="New 4-digit PIN"/><button class="btn" style="margin-top:14px" onclick="doPin()">Save</button>`)}
function doPin(){const v=$('#npin').value.trim();if(!/^\d{4}$/.test(v)){toast('Enter 4 digits');return}S.sec.pin=v;save();closeSheet();toast('PIN changed')}
function exportAll(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='monzo-backup.json';a.click();toast('Backup downloaded');
}
function wipe(){localStorage.removeItem(KEY);location.href=location.pathname+'?reset=1'}
function dlYear(y){
  const rows=S.ledger.isa.filter(r=>r.y===y);
  const csv=['Month,Opening,Contribution,Dividend,Market,Fee,Closing,Source']
    .concat(rows.map(r=>[ymLabel(r.ym),r.opening,r.contrib,r.div,r.mkt,r.fee,r.closing,r.imported?r.src:'Monzo'].join(',')));
  const b=new Blob([csv.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`isa-${y}.csv`;a.click();toast(`${y} statement downloaded`);
}

let pinBuf='';
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function bioEnrol(){
  const cred=await navigator.credentials.create({publicKey:{
    challenge:crypto.getRandomValues(new Uint8Array(32)),
    rp:{name:'Monzo',id:location.hostname},
    user:{id:crypto.getRandomValues(new Uint8Array(16)),name:S.profile.email,displayName:S.profile.name},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
    timeout:60000,attestation:'none'
  }});
  S.sec.credId=b64(cred.rawId);save();
}
async function bioUnlock(){
  if(!S.sec.credId){try{await bioEnrol();unlock()}catch(e){toast('Fingerprint not set up')}return}
  try{
    await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rpId:location.hostname,
      allowCredentials:[{type:'public-key',id:ub64(S.sec.credId)}],
      userVerification:'required',timeout:60000
    }});
    unlock();
  }catch(e){toast('Fingerprint not recognised')}
}
function lockScreen(){
  pinBuf='';
  $('#view').innerHTML=`<div class="lock" id="lock">
    <div style="margin-top:8px">${mark(58)}</div>
    <h2>Welcome back, Jason</h2>
    <div class="sub">Enter your passcode</div>
    <div class="dots" id="dots">${'<i></i>'.repeat(4)}</div>
    <div class="keys">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="pinKey('${n}')">${n}</button>`).join('')}
      ${S.sec.bio?'<button class="key ghost" onclick="bioUnlock()" aria-label="Use fingerprint"><svg viewBox="0 0 24 24"><path d="M12 4c-4.4 0-8 3.6-8 8v1"/><path d="M20 13v-1c0-4.4-3.6-8-8-8"/><path d="M8.5 12a3.5 3.5 0 0 1 7 0v3.5"/><path d="M12 12v6"/><path d="M15.5 18.5V19"/><path d="M8.5 15.5V19"/></svg></button>':'<span></span>'}
      <button class="key" onclick="pinKey('0')">0</button>
      <button class="key ghost" onclick="pinDel()" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M20 6H9l-5 6 5 6h11z"/><path d="M13 10l4 4M17 10l-4 4"/></svg></button>
    </div>
    <button class="btn ghost sm" style="margin-top:18px" onclick="toast('Passcode is ${S.sec.pin}')">Forgot passcode?</button>
  </div>`;
  $('#tabbar').classList.add('hide');
}
function pinKey(n){
  if(pinBuf.length>=4)return;
  pinBuf+=n;
  $$('#dots i').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length));
  if(pinBuf.length===4)setTimeout(checkPin,140);
}
function pinDel(){
  pinBuf=pinBuf.slice(0,-1);
  $$('#dots i').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length));
}
function checkPin(){
  if(pinBuf===S.sec.pin){unlock();return}
  const l=$('#lock');if(l){l.classList.add('shake');setTimeout(()=>l.classList.remove('shake'),450)}
  pinBuf='';
  setTimeout(()=>$$('#dots i').forEach(d=>d.classList.remove('on')),260);
  toast('Wrong passcode');
}
function unlock(){render()}

const VIEWS={home:vHome,current:vCurrent,all:vAll,hub:vHub,trends:vTrends,savings:vSavings,isa:vISA,inv:vInv,hold:vHold,pot:vPot,tx:vTx,
  flex:vFlex,od:vOD,dd:vDD,sched:vSched,search:vSearch,stmts:vStmts,notifs:vNotifs,budgets:vBudgets,
  profile:vProfile,pd:vPD,security:vSecurity,card:vCard,notifprefs:vNotifPrefs,help:vHelp,move:vMove,pay:vPay,
  settings:vSettings,appearance:vAppearance,mark:vMark,plan:vPlan};

function render(){
  const c=cur(),i=c.indexOf(':'),r=i<0?c:c.slice(0,i),p=i<0?null:c.slice(i+1);
  const view=$('#view');
  view.innerHTML=(VIEWS[r]||vHome)(p);
  view.classList.remove('anim');void view.offsetWidth;view.classList.add('anim');
  $('#tabbar').classList.remove('hide');
  syncTabs();
  applyPriv();
  if(r==='search')bindSearch();
  if(r==='home')countUp();
}
function countUp(){
  if(REDUCED)return;
  $$('[data-count]').forEach(n=>{
    const target=parseFloat(n.dataset.count);let v=0;const step=target/24;
    const t=setInterval(()=>{v+=step;if(v>=target){v=target;clearInterval(t)}n.textContent=gbp(v)},16);
  });
}

(function boot(){
  if(location.search.includes('reset=1')){localStorage.removeItem(KEY);history.replaceState({},'',location.pathname)}
  load();buildTabs();
  const q=new URLSearchParams(location.search);
  if(q.get('screen'))stack=[q.get('screen')];
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(S.prefs.theme==='auto')applyTheme()});
  if(S.sec.lock&&!sessionStorage.getItem('unlocked')){lockScreen();sessionStorage.setItem('unlocked','1')}
  else render();
})();
</script>
