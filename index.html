<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plum — save and invest</title>
<meta name="theme-color" content="#1A0A2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plum">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A0A2B; --plum:#7308E3; --lilac:#D8CEFE; --lilac2:#C3B2FB;
    --linen:#FBF6E9; --line:#EDE4D2; --muted:#7B6C88; --up:#1E9E63; --down:#D8402F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#E8E2D4;display:flex;justify-content:center;align-items:center;
    font-family:"Nunito",Inter,-apple-system,sans-serif;color:var(--ink)}
  .phone{width:376px;height:800px;background:var(--linen);border-radius:28px;position:relative;overflow:hidden;
    border:9px solid #2C2C31;box-shadow:0 0 0 2px #4A4A52,0 20px 46px rgba(26,10,43,.3);flex:0 0 auto}
  .punch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#08070A;z-index:70;box-shadow:inset 0 0 0 1px #2C2C31}
  .status{position:absolute;top:0;left:0;right:0;height:34px;display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px 0;font-size:11.5px;font-weight:700;z-index:65;color:var(--ink);pointer-events:none}
  .status .r{display:flex;gap:5px;align-items:center}
  .app{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:var(--linen);padding-bottom:112px}
  .app::-webkit-scrollbar{display:none}
  .scr{animation:in .22s cubic-bezier(.22,.7,.3,1)}
  @keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .pad{padding:0 18px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:46px 18px 10px}
  .brand{display:flex;align-items:center;gap:7px}
  .wm{font-weight:900;font-size:20px;letter-spacing:-1.3px;color:var(--plum)}
  .ava{width:34px;height:34px;border-radius:50%;background:var(--lilac);color:var(--plum);display:grid;place-items:center;font-size:12px;font-weight:900}
  .iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer}
  h1.greet{font-size:24px;line-height:1.2;margin:2px 0 0;letter-spacing:-1.1px;font-weight:900}
  .sub{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:600}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px}
  .hero{background:linear-gradient(155deg,#7308E3 0%,#8B2BF0 60%,#A94BF7 100%);border-radius:24px;padding:16px;color:#fff;position:relative;overflow:hidden}
  .hero .lbl{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#E2D3FE;display:flex;align-items:center;gap:7px;font-weight:800}
  .hero .big{font-size:37px;font-weight:900;letter-spacing:-1.9px;margin:5px 0 7px;font-variant-numeric:tabular-nums}
  .chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.17);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;color:#D6F7E5}
  .hero .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:#E2D3FE;font-weight:700}
  .ranges{display:flex;gap:4px;margin-top:8px}
  .ranges button{flex:1;background:transparent;border:0;color:#E2D3FE;font-size:11.5px;font-weight:800;padding:7px 0;border-radius:8px;cursor:pointer;font-family:inherit}
  .ranges button.on{background:rgba(255,255,255,.22);color:#fff}
  .live{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#C4F6D9}
  .dot{width:6px;height:6px;border-radius:50%;background:#4FE39A;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .quick button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 3px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit}
  .sect{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
  .sect h2{font-size:16.5px;margin:0;font-weight:900;letter-spacing:-.7px}
  .sect a{font-size:12px;color:var(--plum);font-weight:800;cursor:pointer;text-decoration:none}
  .allow{padding:14px 15px}
  .allow .row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:8px;font-weight:700}
  .bar{height:8px;border-radius:99px;background:var(--lilac);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--plum);border-radius:99px}
  .allow .fine{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.45;font-weight:600}
  .rowitem{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line);cursor:pointer}
  .rowitem:last-child{border-bottom:0}
  .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:10.5px;font-weight:900;color:#fff;flex:0 0 auto}
  .rmain{flex:1;min-width:0}
  .rname{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
  .rsub{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}
  .rval{text-align:right;font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
  .rpc{font-size:11px;margin-top:2px;text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
  .up{color:var(--up)} .down{color:var(--down)}
  .flash-up{animation:fu .7s ease-out} .flash-down{animation:fd .7s ease-out}
  @keyframes fu{0%{background:#DDF7EA}100%{background:transparent}}
  @keyframes fd{0%{background:#FCE4E0}100%{background:transparent}}
  .insight{background:var(--lilac);border-radius:18px;padding:14px;display:flex;gap:10px;margin-top:18px}
  .insight p{margin:0;font-size:12.5px;line-height:1.5;color:#33175A;font-weight:700}
  .insight strong{font-weight:900}
  .lostmoney{background:#FFF3E2;border:1px solid #F8DFBC;border-radius:18px;padding:14px;display:flex;gap:10px;margin-top:12px}
  .lostmoney p{margin:0;font-size:12.5px;line-height:1.5;color:#7A4A12;font-weight:700}
  .lostmoney strong{font-weight:900}
  .tabbar{position:absolute;bottom:0;left:0;right:0;height:92px;background:rgba(255,255,255,.99);border-top:1px solid var(--line);display:flex;align-items:flex-start;padding:8px 3px 0;z-index:40}
  .tabbar button{flex:1;background:0;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;font-weight:800;color:#B3A7C0;cursor:pointer;font-family:inherit;padding:4px 0}
  .tabbar button.on{color:var(--plum)}
  .grab{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:104px;height:4px;border-radius:99px;background:#1A0A2B;opacity:.28;z-index:45}
  .navbar{display:flex;align-items:center;gap:9px;padding:46px 14px 8px}
  .navbar h2{font-size:15px;margin:0;font-weight:900;flex:1;letter-spacing:-.3px}
  .back{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer}
  .donut{display:grid;place-items:center;padding:6px 0 2px}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 9px;padding:4px 4px 0;margin-top:6px}
  .legend div{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);font-weight:700}
  .legend i{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
  .kpi div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 11px}
  .kpi span{display:block;font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:700}
  .kpi b{font-size:13.5px;font-weight:900;font-variant-numeric:tabular-nums}
  .btn{width:100%;border:0;border-radius:15px;padding:15px;font-size:14px;font-weight:900;font-family:inherit;cursor:pointer;background:var(--plum);color:#fff;letter-spacing:-.2px}
  .btn.ghost{background:#fff;color:var(--plum);border:1.5px solid var(--lilac2)}
  .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
  .field{margin-top:13px}
  .field label{font-size:11px;color:var(--muted);display:block;margin-bottom:6px;font-weight:800}
  .amt{display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:17px;padding:13px 15px;gap:8px}
  .amt span{font-size:25px;color:var(--muted);font-weight:800}
  .amt input{border:0;outline:0;background:transparent;font-family:inherit;font-size:29px;font-weight:900;width:100%;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-1.5px}
  .txt{width:100%;border:1.5px solid var(--line);border-radius:15px;padding:12px 14px;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink);background:#fff;outline:0}
  .presets{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .presets button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;font-size:12px;font-family:inherit;cursor:pointer;color:var(--ink);font-weight:800}
  .presets button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
  .seg{display:flex;background:var(--lilac);border-radius:13px;padding:3px;margin-top:13px}
  .seg button{flex:1;border:0;background:0;padding:9px;border-radius:10px;font-family:inherit;font-size:12.5px;font-weight:900;color:#5C4A72;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink)}
  .acts{display:flex;flex-direction:column}
  .act{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .act:last-child{border-bottom:0}
  .act .ic{width:34px;height:34px;border-radius:50%;background:var(--lilac);display:grid;place-items:center;flex:0 0 auto;color:var(--plum)}
  .act .t{font-size:12.5px;font-weight:800}
  .act .d{font-size:10.5px;color:var(--muted);margin-top:2px;font-weight:600}
  .act .v{margin-left:auto;font-size:12.5px;font-weight:900;font-variant-numeric:tabular-nums}
  .monthlab{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:18px 4px 6px;font-weight:900}
  .menu{display:flex;flex-direction:column}
  .menu div{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:700}
  .menu div:last-child{border-bottom:0}
  .menu .chev{margin-left:auto;opacity:.5}
  .legal{font-size:10.5px;color:var(--muted);line-height:1.55;padding:16px 4px 10px;font-weight:600}
  .legal b{color:#5D4B70;font-weight:900}
  .toast{position:absolute;left:14px;right:14px;bottom:104px;background:var(--ink);color:#fff;border-radius:15px;padding:12px 14px;font-size:12.5px;font-weight:700;display:flex;gap:9px;align-items:center;z-index:80;transform:translateY(16px);opacity:0;transition:.28s;pointer-events:none}
  .toast.show{transform:none;opacity:1}
  .sheet{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 14px;margin-top:11px}
  .kv{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;font-weight:700;gap:10px}
  .kv span{color:var(--muted)}
  .kv b{font-weight:900;font-variant-numeric:tabular-nums;text-align:right}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.4px}
  .pill{display:inline-block;font-size:10px;font-weight:900;padding:5px 10px;border-radius:999px;background:var(--lilac);color:#4A1580}
  .pill.grey{background:#F0EBE0;color:var(--muted)}
  .pill.on{background:#DDF7EA;color:#0F7A4A}
  .pill.warn{background:#FFF0ED;color:#C63C28}
  .pocket{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:9px}
  .pocket .nm{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:900}
  .pocket .emo{width:28px;height:28px;border-radius:9px;background:var(--lilac);display:grid;place-items:center;font-size:14px}
  .pocket .amt2{font-size:21px;font-weight:900;letter-spacing:-1px;margin:9px 0 2px;font-variant-numeric:tabular-nums}
  .pocket .tgt{font-size:10.5px;color:var(--muted);font-weight:700}
  .pocket .bar{margin-top:9px;height:7px}
  .tl{position:relative;padding-left:24px}
  .tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--lilac2)}
  .tli{position:relative;padding-bottom:17px}
  .tli:before{content:"";position:absolute;left:-23px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--plum)}
  .tli.crash:before{border-color:var(--down)}
  .tli .yr{font-size:10.5px;font-weight:900;color:var(--plum);letter-spacing:.5px}
  .tli.crash .yr{color:var(--down)}
  .tli .tx{font-size:12px;line-height:1.5;color:#3D2A55;margin-top:3px;font-weight:600}
  .yrs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
  .yrs::-webkit-scrollbar{display:none}
  .yrs button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:11.5px;font-weight:900;font-family:inherit;color:var(--muted);cursor:pointer}
  .yrs button.on{background:var(--plum);border-color:var(--plum);color:#fff}
  .big2{font-size:31px;font-weight:900;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;margin:4px 0}
  .step{display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line)}
  .step:last-child{border-bottom:0}
  .step .num{width:22px;height:22px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900;flex:0 0 auto;margin-top:1px}
  .step .st{font-size:12.5px;font-weight:800;line-height:1.4}
  .step .sd{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5;font-weight:600}
  .banner{border-radius:18px;padding:14px;display:flex;gap:10px;margin-bottom:12px}
  .banner.embed{background:#FFF3E2;border:1px solid #F8DFBC}
  .banner.live{background:#DDF7EA;border:1px solid #B6EBD1}
  .banner p{margin:0;font-size:12px;line-height:1.5;font-weight:700}
  .banner.embed p{color:#7A4A12}
  .banner.live p{color:#0F5F3B}
  .lock{position:absolute;inset:0;z-index:90;background:radial-gradient(120% 80% at 50% 108%,#8B2BF0 0%,#4A0B96 42%,#1A0A2B 100%);display:flex;flex-direction:column;color:#fff;transition:opacity .4s,transform .4s}
  .lock.gone{opacity:0;transform:scale(1.03);pointer-events:none}
  .lock .clock{padding:66px 26px 0;font-size:60px;font-weight:900;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums}
  .lock .date{padding:8px 26px 0;font-size:13.5px;font-weight:700;color:#D9C4FB}
  .lock .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin-top:-30px}
  .lock .wm2{font-weight:900;font-size:22px;letter-spacing:-1.2px;color:#fff;display:flex;align-items:center;gap:8px}
  .fp{position:relative;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);transition:.3s}
  .fp svg{stroke:#E7DAFE;transition:.3s}
  .fp:after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid #7BF5B8;opacity:0;transform:scale(.9)}
  .fp.scan:after{animation:rip 1.1s ease-out infinite}
  .fp.scan svg{stroke:#7BF5B8}
  .fp.ok{background:rgba(123,245,184,.18);border-color:#7BF5B8}
  .fp.ok svg{stroke:#7BF5B8}
  @keyframes rip{0%{opacity:.9;transform:scale(.92)}100%{opacity:0;transform:scale(1.32)}}
  .lockhint{font-size:11.5px;color:#C6ADEF;font-weight:700}
  .lock .foot{padding:0 26px 34px;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#C6ADEF;font-weight:700}
  /* full bleed on a real phone */
  @media (max-width:480px){
    body{display:block;background:var(--linen)}
    .phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}
    .punch{display:none}
    .status{padding-top:max(10px,env(safe-area-inset-top));height:calc(34px + env(safe-area-inset-top))}
    .top{padding-top:calc(46px + env(safe-area-inset-top))}
    .navbar{padding-top:calc(46px + env(safe-area-inset-top))}
    .lock .clock{padding-top:calc(66px + env(safe-area-inset-top))}
    .tabbar{height:calc(92px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
    .app{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
<div class="phone">
  <div class="punch"></div>
  <div class="status"><span>9:41</span><span class="r">
    <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 10.4 5.2 7.9a3.4 3.4 0 0 1 4.6 0zM2.9 5.5 1.4 3.9a8.7 8.7 0 0 1 12.2 0l-1.5 1.6a6.5 6.5 0 0 0-9.2 0z"/></svg>
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <svg width="23" height="11" viewBox="0 0 23 11"><rect x=".5" y=".5" width="18" height="10" rx="2.6" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="13" height="7" rx="1.6" fill="currentColor"/><path d="M20.5 4v3a2 2 0 0 0 0-3z" fill="currentColor" opacity=".5"/></svg>
  </span></div>
  <div class="app" id="app"></div>
  <nav class="tabbar" id="tabbar"></nav>
  <div class="grab"></div>
  <div class="toast" id="toast"></div>
  <div class="lock" id="lock">
    <div class="clock">9:41</div>
    <div class="date">Tue, 2 December</div>
    <div class="mid">
      <div class="wm2"><svg width="26" height="26" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#fff"/><circle cx="19.4" cy="22.6" r="12.2" fill="#7308E3"/><circle cx="30.6" cy="8.6" r="9.4" fill="#fff"/><g transform="rotate(-38 28.6 12.2)"><ellipse cx="28.6" cy="12.2" rx="3.2" ry="7" fill="#fff" stroke="#7308E3" stroke-width="2.9"/></g><path d="M15.6 25.4c1.5 2 4.6 2.2 6.6.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>plum</div>
      <div class="fp" id="fp" onclick="unlock()">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round">
          <path d="M12 4.6c-3 0-5.4 2.4-5.4 5.4v2.2c0 1.3-.3 2.6-.9 3.7"/>
          <path d="M12 7.6a2.4 2.4 0 0 0-2.4 2.4v2.6c0 2-.6 3.9-1.7 5.4"/>
          <path d="M12 10.6v2.8c0 2.2-.7 4.3-1.9 6"/>
          <path d="M14.4 10a2.4 2.4 0 0 1 2.4 2.4v1.6c0 1.9-.4 3.7-1.1 5.3"/>
          <path d="M17.4 10c.1-.5.1-1 .1-1.4a5.5 5.5 0 0 0-11 0"/>
          <path d="M14.6 7.2a2.6 2.6 0 0 1 2.8 2.6c0 .5 0 1-.1 1.5"/></svg>
      </div>
      <div class="lockhint" id="lhint">Touch the fingerprint sensor</div>
    </div>
    <div class="foot"><span>Plum Premium</span><span>Fingerprint</span></div>
  </div>
</div>

<script>
const ICON = {

async function poll(){
  if(!S.fmp||!S.unlocked)return;
  if(budget<=0){S.feedState='budget';patch();return;}
  try{
    const syms=Object.values(QUOTE_MAP).join(',');
    const res=await fetch('https://financialmodelingprep.com/api/v3/quote/'+syms+'?apikey='+encodeURIComponent(S.fmp));
    budget--;localStorage.setItem('plum_budget',String(budget));
    if(res.status===429){S.feedState='throttled';backoff=Math.min(backoff*2,600000);patch();return;}
    if(!res.ok)throw 0;
    const data=await res.json();
    if(!Array.isArray(data)||!data.length)throw 0;
    let hit=0;
    data.forEach(q=>{const id=Object.keys(QUOTE_MAP).find(k=>QUOTE_MAP[k]===q.symbol);const h=S.hold.find(x=>x.id===id);if(!h||typeof q.price!=='number')return;if(h.p)h.v=h.v*(q.price/h.p);h.p=q.price;if(typeof q.changesPercentage==='number')h.d=+q.changesPercentage.toFixed(2);hit++;});
    if(hit){S.feedState='live';backoff=60000;S.bal=S.hold.reduce((a,h)=>a+h.v,0)+S.cash+S.pockets;patch();}
  }catch(e){S.feedState='error';backoff=Math.min(backoff*2,600000);patch();}
}

  if(!S.unlocked)return;

}

    if(val!=null&&el.textContent!==val){el.textContent=val;if(cls){el.className=cls+' flash-'+cls;setTimeout(()=>{el.className=cls;},700);}}

function yearEvents(y){
  const out=[];let s=y*37+5;const r=()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648;};
  const label=y<1997?'TESSA deposit':y<1999?'PEP subscription':'ISA subscription';
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const n=4+Math.floor(r()*4);
  for(let i=0;i<n;i++){const m=months[Math.floor(r()*12)];const amt=(y<1999?250:y<2010?500:y<2018?800:1250)*(1+Math.floor(r()*3));out.push({d:m,t:label,s:'Standing order · Barclays',v:'+'+money(amt),c:'up'});}
  out.push({d:'06 Apr',t:'Tax year opens',s:'Allowance reset',v:'',c:''});
  if(r()>.3)out.push({d:'14 Jun',t:'Dividend received',s:'Reinvested',v:'+'+money(40+r()*400),c:'up'});
  out.push({d:'01 Oct',t:'Platform fee',s:'Annualised 0.25%',v:'−'+money(3+r()*30),c:''});
  return out.slice(0,7);
}

}

function feed(){
  return `<div class="scr">
    <div class="navbar"><div class="back" onclick="tab('profile')">${svg(ICON.back,18)}</div><h2>Live prices</h2></div>
    <div class="pad">
      <div class="card" style="padding:15px">
        <div style="display:flex;align-items:center;gap:11px">
          <div class="logo" style="background:${S.feedState==='live'?'#1E9E63':S.feedState==='throttled'||S.feedState==='error'?'#D8402F':'var(--lilac)'};color:${S.feedState==='sim'?'var(--plum)':'#fff'}">${svg(ICON.bolt,17)}</div>
          <div style="flex:1"><div class="rname">Market data</div><div class="rsub" id="feedState">${feedLabel()}</div></div></div>
        <div style="height:11px"></div>

      ${S.fmp?`<button class="btn ghost" style="margin-top:9px" onclick="disconnect()">Disconnect</button>`:''}
      <div class="insight" style="margin-top:14px">${svg(ICON.shield,19)}<p>Free keys allow 250 requests a day. The app stops at the cap, resumes tomorrow, and doubles the gap whenever the provider rate-limits.</p></div>
      <div class="sect"><h2>What uses real quotes</h2></div>
      <div class="card acts">
        ${S.hold.map(h=>`<div class="act"><div class="ic">${svg(QUOTE_MAP[h.id]?ICON.chk:ICON.clock,16)}</div><div><div class="t">${h.t}</div><div class="d">${QUOTE_MAP[h.id]?QUOTE_MAP[h.id]+' · live':'No listed ticker · modelled'}</div></div></div>`).join('')}</div>

}

        <div class="ava" style="width:56px;height:56px;font-size:16px">JW</div>
        <div><div style="font-size:16.5px;font-weight:900;letter-spacing:-.5px">James Whitfield</div><div class="sub" style="margin-top:2px">Client ref PLM-88214</div></div></div>
      <div style="margin-top:11px"><span class="pill">Plum Premium</span> <span class="pill grey">0.25% platform fee</span></div>
      <div class="sect"><h2>Account</h2></div>

      <div class="sect"><h2>Money</h2></div>
      <div class="card menu">

        <div onclick="go('credit')">${svg(ICON.gauge,17)}Credit score<span class="chev"><span class="pill">721</span></span></div>
        <div onclick="go('rules')">${svg(ICON.rule,17)}Rules<span class="chev">${svg(ICON.chev,15)}</span></div></div>
      <div class="sect"><h2>Security</h2></div>
      <div class="card menu">
        <div onclick="lockNow()">${svg(ICON.fp,17)}Lock with fingerprint<span class="chev">${svg(ICON.chk,15)}</span></div>
        <div onclick="toast('PIN changed')">${svg(ICON.shield,17)}PIN<span class="chev">${svg(ICON.chev,15)}</span></div></div>
      <div class="sect"><h2>App</h2></div>

      <div class="legal"><b>Plum Fintech Ltd</b> is authorised and regulated by the Financial Conduct Authority (FRN 810322). Registered in England &amp; Wales, no. 09833389. Registered office: 4 Fenchurch Place, London EC3M 4AJ.<br><br>Interest Pockets provided by Investec Bank plc. Eligible investments covered by the FSCS up to £85,000. Capital at risk.<br><br>App version 6.3.0 (3160) · recreation.</div>

    </div></div>`;
}

const embedded=()=>{try{return window.top!==window.self;}catch(e){return true;}};
const installed=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

function install(){
  const emb=embedded(),inst=installed();
  return `<div class="scr">
    <div class="navbar"><div class="back" onclick="tab('profile')">${svg(ICON.back,18)}</div><h2>Install Plum</h2></div>
    <div class="pad">
      <div style="background:linear-gradient(155deg,#7308E3,#A94BF7);border-radius:22px;padding:18px;color:#fff;display:flex;gap:13px;align-items:center">
        <div style="transform:scale(1.5);margin-left:5px"><svg width="26" height="26" viewBox="0 0 40 40">${LOGO('#fff','#7308E3')}</svg></div>
        <div style="margin-left:10px"><div style="font-size:13.5px;font-weight:900">Install on your S24 Ultra</div><div style="font-size:11px;color:#E2D3FE;margin-top:3px;font-weight:700">Real home-screen icon, full screen, works offline.</div></div></div>
      <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">
        <span class="pill ${emb?'warn':'on'}">${emb?'Running in an embed':'Running as a page'}</span>
        <span class="pill ${inst?'on':'grey'}">${inst?'Installed':'Not installed'}</span></div>
      ${emb?`<div class="banner embed" style="margin-top:12px">${svg(ICON.dl,18)}<p>Chrome only installs from a real web address. Host these files first, then the button below works.</p></div>`
           :`<div class="banner live" style="margin-top:12px">${svg(ICON.chk,18)}<p><strong>You're on the hosted page.</strong> Tap install below.</p></div>`}
      <div class="sect"><h2>If you haven't hosted it yet</h2></div>
      <div class="card">
        <div class="step"><div class="num">1</div><div><div class="st">Save these files into one folder</div><div class="sd">index.html, manifest.json, sw.js, icon.svg</div></div></div>
        <div class="step"><div class="num">2</div><div><div class="st">Drag the folder onto Netlify Drop</div><div class="sd">Free https link in about ten seconds.</div></div></div>
        <div class="step"><div class="num">3</div><div><div class="st">Open that link in Chrome and install</div><div class="sd">Menu ⋮ → Install app.</div></div></div></div>
      <a class="btn ghost" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:11px;text-decoration:none" href="https://app.netlify.com/drop" target="_blank" rel="noopener">Open Netlify Drop</a>
      <button class="btn" style="margin-top:11px" onclick="doInstall()">${inst?'Already installed':'Install now'}</button>
      <div class="legal">Once installed it runs from the home screen with its own icon and no browser chrome. The offline worker caches the app so it opens without a signal.</div>
      <div style="height:10px"></div></div></div>`;
}

function render(){
  const map={home,portfolio,move,activity,profile,install,detail,pockets,history,feed,spend,credit,rules};
  document.getElementById('app').innerHTML=(map[S.scr]||home)();
  const tabs=[['home','Home',ICON.home],['pockets','Pockets',ICON.pot],['portfolio','Invest',ICON.pie],['activity','Activity',ICON.list],['profile','Profile',ICON.user]];
  document.getElementById('tabbar').innerHTML=tabs.map(([k,l,i])=>`<button class="${S.tab===k?'on':''}" onclick="tab('${k}')">${svg(i,20)}<span>${l}</span></button>`).join('');
  patch();
}
function renderPresets(){const p=document.getElementById('presets');if(p)p.innerHTML=[500,1000,2500,5000].map(a=>`<button class="${String(a)===S.amt?'on':''}" onclick="S.amt='${a}';render()">${money(a,0)}</button>`).join('');}
function commit(){
  const n=parseFloat(String(S.amt).replace(/[^0-9.]/g,''));
  if(!n||n<=0)return toast('Enter an amount');
  if(S.mode==='out'&&n>S.cash)return toast('More than your available cash');
  if(S.mode==='add'){S.cash+=n;S.bal+=n;S.open+=n;}else{S.cash-=n;S.bal-=n;S.open-=n;}
  S.extra=[{t:S.mode==='add'?'Deposit':'Withdrawal',s:'Barclays •••• 4471 · processing',v:(S.mode==='add'?'+':'−')+money(n),c:S.mode==='add'?'up':''}].concat(S.extra).slice(0,4);
  S.amt='';save();
  toast(S.mode==='add'?money(n)+' added to your ISA':money(n)+' on its way');
  tab('home');
}
function connectFeed(){
  const k=(S.fmp||'').trim();
  if(!k)return toast('Paste an API key first');
  localStorage.setItem('plum_key',k);S.feedState='sim';backoff=60000;render();toast('Connecting…');
  poll().then(()=>{schedulePoll();render();toast(S.feedState==='live'?'Feed connected':'Key saved · check the address');});
}
function disconnect(){S.fmp='';S.feedState='sim';clearTimeout(feedTimer);localStorage.removeItem('plum_key');render();toast('Feed disconnected');}

let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;});
async function doInstall(){
  if(deferred){deferred.prompt();const r=await deferred.userChoice;deferred=null;return toast(r.outcome==='accepted'?'Installing…':'Dismissed');}
  toast(embedded()?'Open the hosted link in Chrome first':'Use Chrome menu ⋮ → Install app');
}

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
render();
setTimeout(unlock,900);
</script>
