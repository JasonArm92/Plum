function barChart(vals,labels,w,h){

}
function donut(data,w=150){
  const total=data.reduce((s,d)=>s+d.v,0)||1;let a=-Math.PI/2;
  const R=w/2,r=R*.62;
  const arcs=data.map(d=>{
    const ang=d.v/total*Math.PI*2,a2=a+ang;
    const p=(rad,an)=>[w/2+Math.cos(an)*rad,w/2+Math.sin(an)*rad];
    const [x1,y1]=p(R,a),[x2,y2]=p(R,a2),[x3,y3]=p(r,a2),[x4,y4]=p(r,a);
    const big=ang>Math.PI?1:0;a=a2;
    return `<path d="M${x1} ${y1} A${R} ${R} 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${big} 0 ${x4} ${y4} Z" fill="${d.c}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${w}" style="width:${w}px;height:${w}px" aria-hidden="true">${arcs}</svg>`;
}

let deferred=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
async function installApp(){
  if(deferred){deferred.prompt();const r=await deferred.userChoice;deferred=null;toast(r.outcome==='accepted'?'Installing…':'Install dismissed');return}
  if(STANDALONE){toast('Already installed');return}
  toast('Open the browser menu and choose “Add to Home screen”');
}
function isaAdd(){
  const used=tyUsed(),lim=ISA_LIMITS[taxYear()]||20000,room=lim-used;
  if(room<=0){toast('Allowance used for '+tyLabel(taxYear()));return}
  sheet(`<h2>Add to ISA</h2><p class="small muted">${tyLabel(taxYear())} allowance: ${gbp(used)} used of ${gbp(lim)}. ${gbp(room)} remaining.</p>
    <label class="f">Amount</label><input id="isaAmt" type="number" inputmode="decimal" placeholder="0.00"/>
    <div style="display:flex;gap:8px;margin-top:10px">${[100,500,1000].map(v=>`<button class="badge" onclick="document.getElementById('isaAmt').value=${v}">${gbp0(v)}</button>`).join('')}<button class="badge" onclick="document.getElementById('isaAmt').value=${room.toFixed(2)}">Max</button></div>
    <button class="btn" style="margin-top:16px" onclick="doIsaAdd(${room})">Add</button>`);
}
function doIsaAdd(room){
  let v=parseFloat($('#isaAmt').value||'0');
  if(!(v>0)){toast('Enter an amount');return}
  if(v>room){v=room;toast('Capped at remaining allowance')}
  if(v>S.acct.current){toast('Not enough in current account');return}
  S.acct.current=+(S.acct.current-v).toFixed(2);S.acct.isaCash=+(S.acct.isaCash+v).toFixed(2);
  const last=S.ledger.isa[S.ledger.isa.length-1];
  last.contrib=+(last.contrib+v).toFixed(2);last.closing=+(last.closing+v).toFixed(2);
  S.notifs.unshift({t:'ISA contribution',b:`${gbp(v)} added for ${tyLabel(taxYear())}`,d:'now',i:'ISA'});
  save();closeSheet();render();toast(`${gbp(v)} added to your ISA`);
}
function potMove(id,sign){
  const p=S.pots.find(x=>x.id===id);
  sheet(`<h2>${sign>0?'Add to':'Withdraw from'} ${esc(p.n)}</h2><label class="f">Amount</label>
    <input id="pmAmt" type="number" inputmode="decimal" placeholder="0.00"/>
    <button class="btn" style="margin-top:16px" onclick="doPotMove('${id}',${sign})">Confirm</button>`);
}
function doPotMove(id,sign){
  const p=S.pots.find(x=>x.id===id),v=parseFloat($('#pmAmt').value||'0');
  if(!(v>0)){toast('Enter an amount');return}
  if(sign>0&&v>S.acct.current){toast('Not enough available');return}
  if(sign<0&&v>p.a){toast('Not enough in pot');return}
  p.a=+(p.a+sign*v).toFixed(2);S.acct.current=+(S.acct.current-sign*v).toFixed(2);
  S.acct.savings=+S.pots.reduce((s,x)=>s+x.a,0).toFixed(2);
  save();closeSheet();render();toast(sign>0?`${gbp(v)} moved to ${p.n}`:`${gbp(v)} moved back`);
}
function newPot(){
  sheet(`<h2>New pot</h2><label class="f">Name</label><input id="npName" placeholder="e.g. New car"/>
    <label class="f">Goal</label><input id="npGoal" type="number" inputmode="decimal" placeholder="0"/>
    <button class="btn" style="margin-top:16px" onclick="doNewPot()">Create</button>`);
}
function doNewPot(){
  const n=$('#npName').value.trim()||'New pot',g=parseFloat($('#npGoal').value||'500');
  S.pots.push({id:'p'+Date.now(),n,a:0,rate:2.80,goal:g,lock:null,ico:'🎯',col:'#7A5AF8'});
  save();closeSheet();render();toast('Pot created');
}
function archivePot(id){
  const p=S.pots.find(x=>x.id===id);
  if(p.a>0)S.acct.current=+(S.acct.current+p.a).toFixed(2);
  S.pots=S.pots.filter(x=>x.id!==id);S.acct.savings=+S.pots.reduce((s,x)=>s+x.a,0).toFixed(2);
  save();back();toast('Pot archived');
}
function odMove(sign){
  if(sign>0){
    const room=S.acct.odLimit-S.acct.odDrawn;if(room<=0){toast('At limit');return}
    const v=Math.min(100,room);S.acct.odDrawn=+(S.acct.odDrawn+v).toFixed(2);S.acct.current=+(S.acct.current+v).toFixed(2);toast(`${gbp(v)} drawn`);
  }else{
    if(S.acct.odDrawn<=0){toast('Nothing to repay');return}
    const v=Math.min(100,S.acct.odDrawn,S.acct.current);if(v<=0){toast('No funds');return}
    S.acct.odDrawn=+(S.acct.odDrawn-v).toFixed(2);S.acct.current=+(S.acct.current-v).toFixed(2);toast(`${gbp(v)} repaid`);
  }
  save();render();
}

function exportAll(){

function dlYear(y){
  const rows=S.ledger.isa.filter(r=>r.y===y);
  const csv=['Month,Opening,Contribution,Dividend,Market,Fee,Closing,Source']
    .concat(rows.map(r=>[ymLabel(r.ym),r.opening,r.contrib,r.div,r.mkt,r.fee,r.closing,r.imported?r.src:'Monzo'].join(',')));
  const b=new Blob([csv.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`isa-${y}.csv`;a.click();toast(`${y} statement downloaded`);

function lockScreen(){
  $('#view').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:40px 24px">
    <div class="center"><div style="margin-bottom:22px">${mark(56)}</div>
      <div style="font-size:22px;font-weight:800;letter-spacing:-.5px">Welcome back, Jason</div>
      <div class="small muted" style="margin-top:4px">Touch the sensor to unlock</div>
      <button onclick="unlock()" aria-label="Unlock with fingerprint" style="margin:26px auto 0;width:104px;height:104px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;transition:transform .18s var(--snap)">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#FF4F40" stroke-width="1.6" stroke-linecap="round">
          <path d="M12 4c-4.4 0-8 3.6-8 8v1"/><path d="M20 13v-1c0-4.4-3.6-8-8-8"/>
          <path d="M8.5 12a3.5 3.5 0 0 1 7 0v3.5"/><path d="M12 12v6"/><path d="M15.5 18.5V19"/><path d="M8.5 15.5V19"/></svg></button>
      <button class="btn ghost sm" style="margin-top:22px" onclick="unlock()">Use passcode</button></div></div>`;

}
function unlock(){render()}

const VIEWS={home:vHome,hub:vHub,trends:vTrends,savings:vSavings,isa:vISA,inv:vInv,hold:vHold,pot:vPot,tx:vTx,
  flex:vFlex,od:vOD,dd:vDD,sched:vSched,search:vSearch,stmts:vStmts,notifs:vNotifs,budgets:vBudgets,
  profile:vProfile,pd:vPD,security:vSecurity,card:vCard,notifprefs:vNotifPrefs,help:vHelp,move:vMove,pay:vPay,
  settings:vSettings,appearance:vAppearance,mark:vMark};

function render(){
  const c=cur(),i=c.indexOf(':'),r=i<0?c:c.slice(0,i),p=i<0?null:c.slice(i+1);
  const view=$('#view');
  view.innerHTML=(VIEWS[r]||vHome)(p);
  view.classList.remove('anim');void view.offsetWidth;view.classList.add('anim');
  $('#tabbar').classList.remove('hide');
  syncTabs();
  if(r==='search')bindSearch();
  if(r==='home')countUp();
}
function countUp(){
  if(REDUCED)return;
  $$('[data-count]').forEach(n=>{
    const target=parseFloat(n.dataset.count);let v=0;const step=target/24;
    const t=setInterval(()=>{v+=step;if(v>=target){v=target;clearInterval(t)}n.textContent=gbp(v)},16);
  });
}

(function boot(){
  if(location.search.includes('reset=1')){localStorage.removeItem(KEY);history.replaceState({},'',location.pathname)}
  load();buildTabs();
  const q=new URLSearchParams(location.search);
  if(q.get('screen'))stack=[q.get('screen')];
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(S.prefs.theme==='auto')applyTheme()});
  if(S.sec.bio&&!sessionStorage.getItem('unlocked')){lockScreen();sessionStorage.setItem('unlocked','1')}
  else render();
})();
</script>
