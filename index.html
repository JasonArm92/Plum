function runCalendar(){
  const t=now();
  if(S.st.lastFee){
    const months=monthStarts(new Date(S.st.lastFee),new Date(t));
    months.forEach(()=>{const fee=planFee()+total()*platFee()/12;S.st.cash-=fee;ledger('out',fee,'Plum monthly fee','Fees')});
    if(months.length)S.st.lastFee=months[months.length-1].getTime()+1;
    const cur=new Date(new Date().getFullYear(),new Date().getMonth(),1).getTime();
    if(S.st.lastFee<cur)S.st.lastFee=cur;
  }
  if(t-S.st.lastDiv>864e5*91){
    const runs=Math.min(Math.floor((t-S.st.lastDiv)/(864e5*91)),4);
    for(let r=0;r<runs;r++){
      let sum=0;
      for(const s in S.st.holdings){const h=S.st.holdings[s];if(h.q>0){const a=h.q*pxOf(s).p*0.0038;sum+=a;S.st.cash+=a}}
      if(sum>0){ledger('in',sum,'Dividend distribution','Income');notify('Dividend received',`${M(sum)} credited to your cash balance.`,'fills')}
    }
    S.st.lastDiv=t;
  }
  save();
}
function checkAlerts(){
  S.st.alerts.filter(a=>a.act).forEach(a=>{
    const p=pxOf(a.s).p;
    if(!a.fired&&p>=a.v){a.fired=true;a.act=false;notify('Price alert',`${a.s} reached ${M(p)}`,'alerts');save()}
  });
}
function checkOrders(){
  const t=now();
  S.st.orders.filter(o=>o.status==='pending'||o.status==='queued').forEach(o=>{
    const px=pxOf(o.s).p;
    if(o.status==='queued'){if(navigator.onLine)o.status='pending';return}
    if(o.type==='market'){if(t>=o.fillAt)fill(o,px*(o.side==='buy'?1.0008:.9992));return}
    if(o.type==='limit'){
      if(o.side==='buy'&&px<=o.limit)return fill(o,o.limit);
      if(o.side==='sell'&&px>=o.limit)return fill(o,o.limit);
      if(t>o.exp)reject(o,'Limit not reached before expiry');
      return;
    }
    if(o.type==='stop'){if(px<=o.stop)return fill(o,px);if(t>o.exp)reject(o,'Stop not triggered before expiry')}
  });
}
function fill(o,px){
  const g=o.qty*px;
  if(o.side==='buy'&&g>S.st.cash)return reject(o,'Insufficient cash at fill');
  if(o.side==='buy'){S.st.cash-=g;const h=S.st.holdings[o.s]||{q:0,cost:0};h.q+=o.qty;h.cost+=g;S.st.holdings[o.s]=h}
  else{
    const h=S.st.holdings[o.s];
    if(!h||h.q<o.qty-1e-6)return reject(o,'Not enough units to sell');
    const before=h.q;h.q-=o.qty;h.cost=Math.max(0,h.cost*(1-o.qty/before));S.st.cash+=g;
    if(h.q<1e-4)delete S.st.holdings[o.s];
  }
  o.status='filled';o.filledAt=now();o.fillPx=px;o.ref=o.ref||ref();
  ledger(o.side==='buy'?'out':'in',g,`${o.side==='buy'?'Buy':'Sell'} ${o.qty.toFixed(4)} ${o.s}`,o.side==='buy'?'Buy':'Sell');
  notify('Order filled',`${o.qty.toFixed(4)} ${o.s} at ${M(px)}`,'fills');
  haptic(12);
  save();
}
function reject(o,why){o.status='rejected';o.why=why;o.filledAt=now();notify('Order rejected',`${o.s} — ${why}`,'fills');save()}

}

    <div class="mono" style="font-weight:800">${M(v)}</div></div>`}).join('')}</div>`:''}
  <div class="card tight">${body||'<div class="empty"><div class="e">🧾</div>Nothing spent this month</div>'}</div>
  <button class="btn ghost" data-act="go" data-s="activity">See investing activity</button>
</div>`;
};

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,s=el.dataset.s,id=el.dataset.id;
  const stop=()=>{e.preventDefault();e.stopPropagation()};
  switch(a){
    case 'go':stop();go(s,{q:el.dataset.q!==undefined?el.dataset.q:''});break;
    case 'back':stop();back();break;
    case 'htab':stop();S.homeTab=el.dataset.t;render();break;
    case 'range':stop();S.range=el.dataset.r;render();break;
    case 'theme':stop();S.q=el.dataset.t;go('theme');break;
    case 'sort':stop();S.sort=el.dataset.k;render();break;
    case 'filter':stop();S.q=el.dataset.c;S.lim=60;render();break;
    case 'txrange':stop();S.txrange=S.txrange===+el.dataset.d?0:+el.dataset.d;render();break;
    case 'more':stop();S.lim=(S.lim||60)+60;render();break;
    case 'smonth':stop();S.spendMonth=Math.max(0,(S.spendMonth||0)+ +el.dataset.d);render();break;
    case 'merch':stop();S.q=el.dataset.m;go('merch');break;
    case 'scat':stop();S.q=el.dataset.c;go('scat');break;
    case 'recOff':stop();S.st.recOff.push(el.dataset.id);save();render();toast('Hidden');break;
    case 'mult':stop();S.st.roundMult=+el.dataset.m;save();render();break;
    case 'pref':stop();{const k=el.dataset.k;S.st.prefs[k]=!S.st.prefs[k];save();render();break}
    case 'plan':{
      stop();const k=el.dataset.k;S.st.plan=k;
      const cur=S.st.subs[0];
      if(cur){cur.n='Plum '+k;cur.amt=PLANS[k].p;cur.act=PLANS[k].p>0}
      save();render();toast(k==='Basic'?'Switched to Basic':`Now on Plum ${k}`);break;}
    case 'freeze':{
      stop();S.st.card.frozen=!S.st.card.frozen;save();haptic(14);
      const pc=MAIN.querySelector('.pcard');if(pc){pc.classList.add('flip');setTimeout(()=>pc.classList.remove('flip'),480)}
      toast(S.st.card.frozen?'Card frozen':'Card unfrozen');render();break;}
    case 'pinview':{
      stop();
      sheet(`<h3>Card PIN</h3><p class="s mut" style="margin:8px 0 14px">Keep it to yourself</p><div class="card" style="text-align:center;font-size:26px;letter-spacing:8px;font-weight:800">${S.st.card.pin}</div><button class="btn" data-act="closesheet">Done</button>`);
      break;}
    case 'climit':{stop();sheet(`<h3>Monthly limit</h3><div class="fld" style="margin-top:12px"><label for="lim">Amount</label><input id="lim" type="number" value="${S.st.card.limit}"></div><button class="btn" data-act="climitsave">Save</button>`);break;}
    case 'climitsave':{stop();S.st.card.limit=+(document.getElementById('lim').value||0);save();document.querySelector('.sheet')?.closeSheet();toast('Limit updated');render();break;}
    case 'replace':{stop();S.st.card.no='5412 '+String(Math.floor(1000+Math.random()*8999))+' '+String(Math.floor(1000+Math.random()*8999))+' '+String(Math.floor(1000+Math.random()*8999));save();toast('New card on the way');render();break;}
    case 'closesheet':stop();document.querySelector('.sheet')?.closeSheet();break;
    case 'schedtoggle':{stop();const x=S.st.sched.find(y=>y.id===id);if(x){x.act=!x.act;save();render()}break;}
    case 'txdet':{
      stop();const t=S.st.tx.find(x=>x.id===id);if(!t)return;
      sheet(`<h3>${esc(t.n)}</h3><p class="s mut" style="margin:6px 0 14px">${DT(t.d)}</p>
        <div class="card tight">
        <div class="row"><div class="gr"><div class="t">Amount</div></div><div class="mono" style="font-weight:800">${t.t==='in'?'+':'−'}${M(t.a)}</div></div>
        <div class="row"><div class="gr"><div class="t">Reference</div></div><div class="mono">${esc(t.ref||'—')}</div></div>
        <div class="row"><div class="gr"><div class="t">Type</div></div><div>${esc(t.cat||'')}</div></div>
        <div class="row"><div class="gr"><div class="t">Status</div></div><div>Settled</div></div></div>
        <button class="btn ghost" data-act="dispute" data-id="${t.id}">Report an issue</button>
        <button class="btn" style="margin-top:8px" data-act="closesheet">Done</button>`);
      break;}
    case 'dispute':{stop();notify('Issue reported','We are looking into this');document.querySelector('.sheet')?.closeSheet();toast('Reported — we will be in touch');break;}
    case 'contract':{
      stop();const o=S.st.orders.find(x=>x.id===id);if(!o)return;
      const lines=['PLUM — CONTRACT NOTE','',`Reference: ${o.ref||o.id}`,`Date: ${DT(o.filledAt||o.at)}`,`Account: ${S.st.profile.name}`,'',
        `Instrument: ${o.s}`,`Side: ${o.side.toUpperCase()}`,`Units: ${o.qty.toFixed(4)}`,`Price: ${(o.fillPx||0).toFixed(4)}`,
        `Consideration: ${(o.qty*(o.fillPx||0)).toFixed(2)}`,`Charges: 0.00`,`Total: ${(o.qty*(o.fillPx||0)).toFixed(2)}`,'',
        'Executed on the London Stock Exchange.','Capital at risk.'];
      await sharePdf(lines,`contract-${o.ref||o.id}.pdf`);break;}
    case 'edit':{
      stop();const sp=S.st.spends.find(x=>x.id===id);if(!sp)return;
      const sh=sheet(`<h3>${esc(sp.n)}</h3><p class="s mut" style="margin:6px 0 14px">${D(sp.d)} · ${M(sp.a)} · ${esc(sp.ref||'')}</p>
        <div class="fld"><label>Category</label><select id="ec">${CATS.map(c=>`<option ${c===sp.c?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="fld"><label>Split across two</label>
          <div style="display:flex;gap:8px"><select id="sc1"><option value="">—</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
          <input id="sa1" type="number" step="0.01" placeholder="Amount"></div></div>
        <button class="btn" data-act="esave" data-id="${sp.id}">Save</button>`);
      setTimeout(()=>sh.querySelector('#ec')?.focus(),240);break;}
    case 'esave':{
      stop();const sp=S.st.spends.find(x=>x.id===id);if(!sp)return;
      const c=document.getElementById('ec').value,c1=document.getElementById('sc1').value,a1=+(document.getElementById('sa1').value||0);
      if(c1&&a1>0&&a1<sp.a){sp.split=[{c,a:a1},{c:sp.c,a:+(sp.a-a1).toFixed(2)}];sp.c=c1}
      else{sp.c=c;sp.split=null}
      save();document.querySelector('.sheet')?.closeSheet();toast('Updated');render();break;}
    case 'bsave':{stop();const b={};CATS.forEach(c=>{const v=+(document.getElementById('b_'+c).value||0);if(v>0)b[c]=v});S.st.budgets=b;save();toast('Budgets saved');back();break;}
    case 'brain':{stop();const k=el.dataset.k;S.st.brain[k]=!S.st.brain[k];save();render();toast(S.st.brain[k]?'Automation on':'Automation off');break;}
    case 'onbgo':stop();S.ob=S.ob||50;go('onb'+el.dataset.n,{},true);break;
    case 'onbsave':{
      stop();S.ob=+(document.getElementById('oa').value||50);
      const f=document.getElementById('of').value;
      S.st.brain.weekly=true;
      S.st.rules.push({id:uid(),n:`Save ${M(S.ob)} ${f.toLowerCase()}`,d:'From your linked bank',act:true});
      save();go('onb3',{},true);break;}
    case 'onbgoal':stop();document.getElementById('og').value=el.dataset.g;break;
    case 'onbgoalnext':{
      stop();S.st.goal=document.getElementById('og').value.trim()||'Rainy day';
      S.st.pockets.unshift({id:uid(),n:S.st.goal,bal:0,goal:Math.max(500,(S.ob||50)*52),rule:'Automated',e:'🎯'});
      save();S.obq=0;go('onb4',{},true);break;}
    case 'onbans':{stop();const q=S.obq||0;if(q===0){S.obq=1;render();return}go('onb5',{},true);break;}
    case 'onbdone':{stop();S.st.onboarded=true;save();S.skel=true;S.scr='home';history.replaceState({},'','#/home');render();setTimeout(()=>{S.skel=false;S.trans='fwd';render()},560);break;}
    case 'replay':stop();S.obq=0;S.ob=50;go('onb1',{},true);break;
    case 'restore':{stop();try{const b=localStorage.getItem(BAK);if(!b)return toast('No backup saved yet');S.st=normalise(JSON.parse(b));save();toast('Restored from backup');render()}catch(e){toast('Backup was unreadable')}break;}
    case 'otype':stop();S.o.type=el.dataset.t;render();break;
    case 'opct':{stop();const px=pxOf(S.q).p;const max=S.o.side==='buy'?S.st.cash/px:(S.st.holdings[S.q]?.q||0);S.o.qty=+(max*(+el.dataset.p)/100).toFixed(4);render();break;}
    case 'order':stop();S.o={side:el.dataset.side,s:el.dataset.s,qty:0,type:'market'};go('order');break;
    case 'sellall':{stop();const h=S.st.holdings[el.dataset.s];if(h){S.o={side:'sell',s:el.dataset.s,qty:+h.q.toFixed(4),type:'market'};go('order')}break;}
    case 'oreview':{
      stop();const err=$('#oerr');
      if(!S.o.qty||S.o.qty<=0)return err.textContent='Enter an amount';
      if(S.o.type!=='market'&&(!S.o.lvl||+S.o.lvl<=0))return err.textContent='Enter a trigger price';
      if(S.o.side==='buy'&&S.o.qty*pxOf(S.o.s).p>S.st.cash)return err.textContent='Not enough cash';
      if(S.o.side==='sell'&&S.o.qty>(S.st.holdings[S.o.s]?.q||0)+1e-6)return err.textContent='Not enough units';
      go('review');break;}
    case 'oconfirm':{
      stop();
      if(S.st.settings.bio&&S.st.cred){const ok=await tryBio();if(!ok)return toast('Fingerprint not recognised')}
      const o={id:uid().toUpperCase().slice(0,8),ref:ref(),s:S.o.s,side:S.o.side,qty:S.o.qty,type:S.o.type,
        limit:S.o.type==='limit'?+S.o.lvl:undefined,stop:S.o.type==='stop'?+S.o.lvl:undefined,
        at:now(),status:navigator.onLine?'pending':'queued',fillAt:nextOpen().getTime(),exp:now()+864e5*30};
      if(o.type!=='market')o.fillAt=now();
      S.st.orders.unshift(o);
      notify('Order placed',`${o.side==='buy'?'Buy':'Sell'} ${o.qty.toFixed(4)} ${o.s}`,'fills');
      save();go('receipt',{q:o.id},true);break;}
    case 'undo':{stop();const o=S.st.orders.find(x=>x.id===id);
      if(o&&(o.status==='pending'||o.status==='queued')){o.status='cancelled';notify('Order cancelled',`${o.s} cancelled`,'fills');save();toast('Order cancelled');go('portfolio')}break;}
    case 'alert':{stop();const p=pxOf(s).p;S.st.alerts.unshift({id:uid(),n:`Price alert · ${s}`,kind:'price',s,v:+(p*1.05).toFixed(2),act:true});save();toast('Alert set 5% above price');break;}
    case 'watch':{stop();if(S.st.watch.includes(s))S.st.watch=S.st.watch.filter(x=>x!==s);else S.st.watch.push(s);save();render();break;}
    case 'pnew':{stop();const n=prompt('Pocket name');if(!n)return;S.st.pockets.push({id:uid(),n,bal:0,goal:1000,rule:'Manual',e:'🫙'});save();render();break;}
    case 'padd':{stop();const p=S.st.pockets.find(x=>x.id===id);const v=+(prompt('Amount to add','50')||0);
      if(!p||!v||v>S.st.cash)return toast('Check the amount');
      S.st.cash-=v;p.bal+=v;ledger('out',v,`To pocket · ${p.n}`,'Pocket');save();render();break;}
    case 'pdel':{stop();const p=S.st.pockets.find(x=>x.id===id);if(!p)return;
      S.st.cash+=p.bal;ledger('in',p.bal,`Closed pocket · ${p.n}`,'Pocket');
      S.st.pockets=S.st.pockets.filter(x=>x.id!==id);save();render();break;}
    case 'rtoggle':{stop();const r=S.st.rules.find(x=>x.id===id);if(r){r.act=!r.act;save();render()}break;}
    case 'rnew':{stop();const n=prompt('Rule name','Round up spare change');if(!n)return;S.st.rules.push({id:uid(),n,d:'Every purchase',act:true});save();render();break;}
    case 'mconfirm':{
      stop();const v=+(document.getElementById('amt').value||0),to=document.getElementById('to').value,err=$('#merr');
      if(!v||v<=0)return err.textContent='Enter an amount';
      if(v>S.st.cash)return err.textContent='Not enough cash';
      S.st.cash-=v;
      if(to==='cash')ledger('in',v,'To main cash','Move');
      else{const p=S.st.pockets.find(x=>x.id===to);if(p){p.bal+=v;ledger('out',v,`To pocket · ${p.n}`,'Pocket')}}
      save();toast('Moved');back();break;}
    case 'topup':{stop();const v=+(prompt('Amount from bank','250')||0);if(!v||v<=0)return;
      if(usedAllow()+v>20000)return toast('That exceeds your £20,000 allowance');
      S.st.cash+=v;ledger('in',v,'From linked bank','Contribution');save();toast(`${M(v)} added`);render();break;}
    case 'withdraw':{stop();const v=+(prompt('Amount to bank',String(Math.min(500,Math.floor(S.st.cash))))||0);
      if(!v||v<=0)return;if(v>S.st.cash)return toast('Not enough cash');
      S.st.cash-=v;ledger('out',v,'To linked bank','Withdrawal');save();toast('Sent — 1–2 working days');render();break;}
    case 'psave':{stop();['name','email','phone','addr','dob','ni'].forEach(k=>{const i=document.getElementById('f_'+k);if(i)S.st.profile[k]=i.value.trim()});save();toast('Saved');back();break;}
    case 'badd':{stop();S.st.banks.push({id:uid(),n:document.getElementById('bn').value,last4:document.getElementById('bl').value.padStart(4,'0'),bal:0});save();render();break;}
    case 'bdel':{stop();S.st.banks=S.st.banks.filter(x=>x.id!==id);save();render();break;}
    case 'paddp':{
      stop();
      const n=document.getElementById('pn').value.trim(),sc=document.getElementById('psc').value.replace(/\D/g,'').padEnd(6,'0').slice(0,6),ac=document.getElementById('pac').value.replace(/\D/g,'');
      const bad=validSC(sc,ac)||(!n?'Enter a name':'');if(bad)return $('#perr').textContent=bad;
      const code=String(Math.floor(100000+Math.random()*900000));S.otp={code,payee:{n,sc,ac}};
      const sh=sheet(`<h3>Verify new payee</h3><p class="s mut" style="margin:8px 0 14px">We sent a code to ${esc(S.st.profile.phone)}. Code: <b>${code}</b></p>
        <div class="fld"><label for="otp">6-digit code</label><input id="otp" inputmode="numeric" maxlength="6"></div>
        <div id="otperr" class="err"></div><button class="btn" data-act="otpconfirm">Confirm</button>`);
      setTimeout(()=>sh.querySelector('#otp')?.focus(),240);break;}
    case 'otpconfirm':{stop();const v=$('#otp')?.value||'';if(v!==S.otp?.code)return $('#otperr').textContent='Wrong code';
      S.st.payees.push({id:uid(),...S.otp.payee,cool:now()+120000});S.otp=null;save();document.querySelector('.sheet')?.closeSheet();toast('Payee added');render();break;}
    case 'pdelp':{stop();S.st.payees=S.st.payees.filter(x=>x.id!==id);save();render();break;}
    case 'dgen':{
      stop();const months=+document.getElementById('dr').value,cut=now()-months*30*864e5;
      const rows=S.st.tx.filter(t=>t.d>=cut);
      const lines=['PLUM — STATEMENT',`Account: ${S.st.profile.name}`,`Period: last ${months} month(s)`,`Generated: ${D(now())}`,'',
        'Date       Description                       Amount','─'.repeat(56),
        ...rows.map(t=>`${D(t.d).padEnd(11)}${t.n.slice(0,32).padEnd(33)}${(t.t==='in'?'+':'-')}${t.a.toFixed(2)}`),
        '─'.repeat(56),`Closing value: ${M(total())}`,'','Capital at risk.'];
      await sharePdf(lines,`statement-${months}m.pdf`);
      S.st.docs.unshift({id:uid(),n:`Statement · last ${months} month(s)`,at:now(),lines});save();render();break;}
    case 'dgentax':{
      stop();const y=new Date().getFullYear();
      const contrib=S.st.tx.filter(t=>t.cat==='Contribution'&&new Date(t.d).getFullYear()===y).reduce((a,b)=>a+b.a,0);
      const divs=S.st.tx.filter(t=>t.cat==='Income'&&new Date(t.d).getFullYear()===y).reduce((a,b)=>a+b.a,0);
      const fees=S.st.tx.filter(t=>t.cat==='Fees'&&new Date(t.d).getFullYear()===y).reduce((a,b)=>a+b.a,0);
      const lines=['PLUM — TAX PACK',`Account: ${S.st.profile.name}`,`Tax year: ${taxYear()}`,`Generated: ${D(now())}`,'',
        `ISA contributions: ${M(contrib)}`,`Allowance remaining: ${M(Math.max(0,20000-contrib))}`,
        `Dividends received: ${M(divs)}`,`Charges paid: ${M(fees)}`,`Portfolio value: ${M(total())}`,
        `Unrealised gain: ${M(total()-cost())}`,'',
        'All figures in GBP. ISA growth is free of UK income and capital gains tax.'];
      await sharePdf(lines,`taxpack-${taxYear().replace('/','-')}.pdf`);
      S.st.taxpacks.unshift({id:uid(),n:`Tax pack ${taxYear()}`,at:now(),lines});save();render();break;}
    case 'dshare':{stop();const d=S.st.docs.find(x=>x.id===id)||S.st.taxpacks.find(x=>x.id===id);if(!d)return;await sharePdf(d.lines||[d.n],`${d.n.replace(/\W+/g,'-')}.pdf`);break;}
    case 'dgenlegal':{stop();await sharePdf(['PLUM — TERMS AND KEY FEATURES','','This is a stocks and shares ISA. Capital at risk.',
      'Annual allowance £20,000. Flexible withdrawals.',`${esc(S.st.plan||'Max')} plan £${planFee().toFixed(2)} a month.`,
      `Management fee ${(platFee()*100).toFixed(2)}% a year.`,'Fund OCFs range 0.06% to 0.30%.','FSCS protection up to £85,000 for investment claims.'],'terms.pdf');break;}
    case 'asknotif':stop();askNotif();break;
    case 'nread':{stop();const n=S.st.notifs.find(x=>x.id===id);if(n){n.read=true;save();render()}break;}
    case 'nclear':{stop();S.st.notifs=[];save();render();break;}
    case 'stoggle':{stop();const x=S.st.subs.find(y=>y.id===id);if(x){x.act=!x.act;save();render()}break;}
    case 'sadd':{stop();const v=+document.getElementById('sa').value;if(!v)return;S.st.subs.push({id:uid(),n:document.getElementById('sn').value,amt:v,cyc:'monthly',act:true});save();render();break;}
    case 'atoggle':{stop();const x=S.st.alerts.find(y=>y.id===id);if(x){x.act=!x.act;x.fired=false;save();render()}break;}
    case 'biotoggle':stop();if(S.st.cred){S.st.cred=null;S.st.settings.bio=false;save();toast('Fingerprint removed');render()}else enrolBio();break;
    case 'pinremove':stop();S.st.pin={hash:'',salt:'',tries:0,lock:0};save();toast('PIN removed');render();break;
    case 'pinsave':{stop();const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value,err=$('#pinerr');
      if(!/^\d{6}$/.test(p1))return err.textContent='PIN must be 6 digits';
      if(p1!==p2)return err.textContent='PINs do not match';
      const salt=uid();S.st.pin={hash:await pbkdf2(p1,salt),salt,tries:0,lock:0};save();toast('PIN set');back();break;}
    case 'unlockbio':{stop();const ok=await tryBio();if(ok){S.locked=false;S.scr='home';S.trans='fwd';render()}else toast('Not recognised — use your PIN');break;}
    case 'skiplock':stop();S.locked=false;S.scr='home';S.trans='fwd';render();break;
    case 'drev':{stop();S.st.devices=S.st.devices.filter(x=>x.id!==id);save();render();break;}
    case 'knext':{stop();const k=S.st.kyc;
      if(k.step===1&&k.exp===undefined)return toast('Pick an option');
      if(k.step===2&&!k.risk)return toast('Accept the risk to continue');
      if(k.step>=2){k.done=true;save();toast('Account set up');go('home');return}
      k.step++;save();render();break;}
    case 'kback':{stop();S.st.kyc.step=Math.max(0,(S.st.kyc.step||0)-1);save();render();break;}
    case 'kset':{stop();const v=+el.dataset.v;if(S.st.kyc.step===1)S.st.kyc.exp=v;else S.st.kyc.risk=!S.st.kyc.risk;save();render();break;}
    case 'chatsend':{
      stop();const i=$('#cm'),m=i.value.trim();if(!m)return;
      S.st.chat.push({me:true,m});i.value='';save();render();
      setTimeout(()=>{
        const r=/isa|allowance/i.test(m)?`Your remaining ISA allowance is ${M(Math.max(0,20000-usedAllow()))} for ${taxYear()}.`
          :/fee|charge/i.test(m)?`${esc(S.st.plan||'Max')} is £${planFee().toFixed(2)} a month plus ${(platFee()*100).toFixed(2)}% management fee.`
          :/withdraw/i.test(m)?'Withdrawals take 1–2 working days and can be replaced in the same tax year.'
          :'Thanks — a human will pick this up. Most answers are in Terms & key features.';
        S.st.chat.push({me:false,m:r});save();if(S.scr==='chat')render();
      },900);break;}
    case 'install':{stop();if(S.installEv){S.installEv.prompt();S.installEv=null}
      else{const el2=$('#ierr');if(el2)el2.textContent='Use Chrome ⋮ → Add to Home screen.';toast('Use Chrome menu → Add to Home screen')}break;}
    case 'export':{stop();backup();const b=new Blob([JSON.stringify(S.st)],{type:'application/json'});
      const u=URL.createObjectURL(b);const a2=document.createElement('a');a2.href=u;a2.download='plum-data.json';a2.click();
      setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Copy exported');break;}
    case 'import':{stop();const inp=document.createElement('input');inp.type='file';inp.accept='application/json';
      inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
        r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.holdings)throw 0;localStorage.setItem(KEY,JSON.stringify(o));location.reload()}catch(e){toast('That file is not valid Plum data')}};
        r.readAsText(f)};inp.click();break;}
  }
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='oqty')S.o.qty=+el.value;
  if(a==='olvl')S.o.lvl=el.value;
  if(a==='ssearch'){S.q=el.value;const t=MAIN.scrollTop;render();MAIN.scrollTop=t;
    const i=MAIN.querySelector('[data-act="ssearch"]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
  if(a==='txsearch'){S.txq=el.value;const t=MAIN.scrollTop;render();MAIN.scrollTop=t;
    const i=MAIN.querySelector('[data-act="txsearch"]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
  if(a==='lockpin'&&el.value.length===6)doPin(el.value);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='cm')document.querySelector('[data-act="chatsend"]')?.click();
  if(e.key==='Enter'&&e.target.dataset.act==='lockpin')doPin(e.target.value);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='theme'){S.st.settings.theme=el.value;save();render()}
  if(el.dataset.act==='idle'){S.st.settings.idle=+el.value;save()}
});
async function doPin(v){
  const p=S.st.pin;if(p.lock>now())return;
  if(await pbkdf2(v,p.salt)===p.hash){S.locked=false;p.tries=0;save();S.scr='home';S.trans='fwd';render()}
  else{p.tries++;if(p.tries>=5){p.lock=now()+60000;p.tries=0;toast('Too many attempts — locked 60s')}else toast(`Wrong PIN · ${5-p.tries} left`);save();render();haptic(40)}
}
let py=0,pulling=false;
MAIN.addEventListener('touchstart',e=>{if(MAIN.scrollTop<=0){py=e.touches[0].clientY;pulling=true}},{passive:true});
MAIN.addEventListener('touchmove',e=>{if(!pulling)return;const dy=e.touches[0].clientY-py;
  if(dy>70&&!document.getElementById('ptr')){const d=document.createElement('div');d.id='ptr';d.className='ptr';d.textContent='↓';document.getElementById('phone').appendChild(d)}},{passive:true});
MAIN.addEventListener('touchend',()=>{const d=document.getElementById('ptr');if(d){d.classList.add('spin');d.textContent='◌';setTimeout(()=>{d.remove();S.trans='fwd';render();poll();toast('Up to date')},650)}pulling=false},{passive:true});
MAIN.addEventListener('pointermove',e=>{
  const box=e.target.closest('[data-act="scrub"]');if(!box)return;
  const r=box.getBoundingClientRect();
  const i=Math.round(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*35);
  const pts=S.st.hist.months.slice(-36);if(!pts[i])return;
  let pill=box.querySelector('.sp');
  if(!pill){pill=document.createElement('div');pill.className='sp';pill.style.cssText='position:absolute;top:-2px;left:0;background:var(--ink);color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;pointer-events:none;transform:translateX(-50%);transition:left .05s linear';box.appendChild(pill)}
  pill.textContent=M(pts[i].v);
  pill.style.left=Math.min(r.width-30,Math.max(30,(i/35)*r.width))+'px';
},{passive:true});
let idleT=0;
['pointerdown','keydown','scroll'].forEach(ev=>document.addEventListener(ev,()=>{
  clearTimeout(idleT);
  idleT=setTimeout(()=>{if(S.st.pin.hash||S.st.cred){S.locked=true;S.scr='lock';render()}},(S.st.settings.idle||5)*60000);
},{passive:true}));
function regSW(){
  if(!('serviceWorker' in navigator)||!location.protocol.startsWith('http'))return;
  navigator.serviceWorker.register('sw.js').then(r=>{
    if('periodicSync' in r)r.periodicSync.register('plum-nudge',{minInterval:900000}).catch(()=>{});
    r.addEventListener('updatefound',()=>{const w=r.installing;if(!w)return;
      w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdate()})});
  }).catch(()=>{});
}
function showUpdate(){
  const d=document.createElement('div');d.className='toast';
  d.innerHTML='<img src="icon.svg" alt="">New version ready <b style="margin-left:auto;text-decoration:underline;cursor:pointer" id="upd">Reload</b>';
  document.getElementById('phone').appendChild(d);
  d.querySelector('#upd').onclick=()=>{navigator.serviceWorker.getRegistration().then(r=>r&&r.waiting&&r.waiting.postMessage('skip'));location.reload()};
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEv=e});
window.addEventListener('online',()=>{toast('Back online');poll()});
window.addEventListener('offline',()=>toast('Offline — orders will queue'));
load();
if(!S.st.cred&&!S.st.pin.hash)S.locked=false;
if((S.st.seedv||0)<SEEDV){
  seedSpend();seedTx();seedRecent();detectRecurring();
  S.st.adj=TARGET-(holdVal()+S.st.cash);
  S.st.seedv=SEEDV;S.st.onboarded=false;backup();save();
}
if(!S.st.recurring.length)detectRecurring();
if(!S.st.open||S.st.open.d!==new Date().toDateString())S.st.open={d:new Date().toDateString(),v:total()};
S.st.adj+=(TARGET-(holdVal()+S.st.cash+S.st.adj))*0.2;
checkOrders();
const h0=location.hash.replace('#/','');
S.scr=S.st.onboarded&&SCREENS[h0]?h0:(S.st.onboarded?'home':'onb1');
history.replaceState({d:0},'','#/'+S.scr);
render();regSW();
setInterval(tick,1000);
setInterval(()=>{if(!document.hidden)poll()},60000);
setInterval(backup,300000);
poll();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkOrders();poll()}});
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(KEY,JSON.stringify(S.st))}catch(e){}});
</script>
</body>
</html>
