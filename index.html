<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plum</title>
<meta name="theme-color" content="#FBF6E9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-purple.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=18c">
<script>
window.__plumErrors = [];
window.addEventListener('error', function (e) {
  window.__plumErrors.push(e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
}, true);
window.addEventListener('unhandledrejection', function (e) {
  window.__plumErrors.push('promise: ' + ((e.reason && e.reason.message) || e.reason));
});
if (location.search.indexOf('reset') > -1) {
  try { caches.keys().then(function (k) { k.forEach(function (n) { caches.delete(n); }); }); } catch (e) {}
  if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (r) { r.forEach(function (x) { x.unregister(); }); });
}
</script>
</head>
<body>
<div id="offline" class="offline" hidden>You're offline — showing your last synced data</div>
<main id="view" class="view"></main>
<nav id="tabs" class="tabs" hidden>

  <a data-tab="invest" class="tab"><svg viewBox="0 0 24 24"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"/></svg><span>Invest</span></a>
  <a data-tab="spend" class="tab"><svg viewBox="0 0 24 24"><path d="M3 7h18v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM3 7l2-3h14l2 3M8 12h8"/></svg><span>Spend</span></a>
  <a data-tab="brain" class="tab"><svg viewBox="0 0 24 24"><path d="M12 5a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 1zm0 0a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-3 1z"/></svg><span>Brain</span></a>
  <a data-tab="profile" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg><span>Profile</span></a>
</nav>
<div id="toasts" class="toasts"></div>
<div id="modal" hidden></div>
<script src="logos.js?v=18c"></script>
<script src="app.js?v=18c"></script>
<script>
setTimeout(function () {
  var v = document.getElementById('view');
  if (v && v.children.length) return;
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:auto 12px 12px 12px;z-index:999;background:#C6362B;color:#fff;padding:14px;border-radius:14px;font:12px/1.5 ui-monospace,monospace;max-height:70vh;overflow:auto';
  box.innerHTML = '<b style="font-size:13px">App did not start</b><br><br>' +
    'url: ' + location.href + '<br>' +
    'controller: ' + (navigator.serviceWorker && navigator.serviceWorker.controller ? 'yes (cached)' : 'no') + '<br>' +
    'errors: ' + (window.__plumErrors.length ? '<br>· ' + window.__plumErrors.join('<br>· ') : 'none') +
    '<br><br><a href="?reset=1" style="color:#fff;text-decoration:underline">Run with ?reset=1</a>';
  document.body.appendChild(box);
}, 1800);
</script>
</body>
</html>
