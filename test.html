<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monzo — tests</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
    background:#0b1a26;color:#e7eef3;margin:0;padding:24px;line-height:1.45}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#8a99a5;font-size:13px;margin-bottom:18px}
  .bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  button{font:inherit;padding:9px 15px;border-radius:500px;border:0;cursor:pointer;
    background:#FF4F40;color:#fff;font-weight:600}
  button.ghost{background:#1c2b36;color:#e7eef3}
  ol{list-style:none;padding:0;margin:0}
  li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;margin-bottom:6px;
    background:#111e28;font-size:14px}
  li.pass{border-left:3px solid #0f9d58}
  li.fail{border-left:3px solid #d9342b;background:#241416}
  .mark{font-weight:700;flex:0 0 auto}
  .pass .mark{color:#5fd08a}
  .fail .mark{color:#ff8b80}
  .err{display:block;color:#ffb4ab;font-size:12.5px;margin-top:3px;font-family:ui-monospace,monospace}
  #summary{font-size:15px;font-weight:700;margin:16px 0;padding:12px 14px;border-radius:12px;background:#111e28}
  #summary.good{background:#12301f;color:#7de0a2}
  #summary.bad{background:#331715;color:#ff9c90}
</style>
</head>
<body>
<h1>Monzo — test harness</h1>
<div class="sub">Not part of the shipped app and not precached. Runs against real modules with a fresh fixture each case.</div>
<div class="bar">
  <button id="run">Run all</button>
  <button class="ghost" id="reset">Clear state</button>
</div>
<div id="summary">Not run</div>
<ol id="out"></ol>

<script type="module">
import {
  fmt, round2, prettyDate, TODAY, MONTHS,
  freshState, load, getState, migrate, VERSION,
  balanceSeries, leftToSpend, balNow, isaBal, flexAvail, tyUsed,
  moveToPot, sendMoney, addVirtualCard, setPlan, flexPurchase, runTick,
  billsbackOptIn, billsbackDraw, challengeSave, arrangeOverdraft, takeLoan
} from './src/core.js';
import { buildSeed, PLANS, TARGET_ISA, BB_CAP } from './src/data.js';

const KEY = 'monzo_v12';
const out = document.getElementById('out');
const summary = document.getElementById('summary');
const results = [];

function test(name, fn){
  try { fn(); results.push({ name, ok: true }); }
  catch (e){ results.push({ name, ok: false, err: e.message }); }
}
const eq = (a, b, msg) => { if (a !== b) throw new Error(msg || `expected ${b}, got ${a}`); };
const near = (a, b, tol, msg) => { if (Math.abs(a - b) > tol) throw new Error(msg || `expected ~${b}, got ${a}`); };
const ok = (v, msg) => { if (!v) throw new Error(msg || 'expected truthy'); };

function withState(mutate){
  const s = freshState();
  if (mutate) mutate(s);
  localStorage.setItem(KEY, JSON.stringify({ ...s, revealed: [] }));
  load();
}

function bigBalance(extra){
  return [{ id: 'seed', date: TODAY, time: '09:00', name: 'Test Income', cat: 'Income',
    amt: 20000, bal: 20000, note: '', ...extra }];
}

/* ---------------- formatting ---------------- */
test('fmt renders two decimals with a pound sign', () => {
  eq(fmt(1234.5), '£1,234.50');
});
test('fmt strips the sign for negatives', () => {
  eq(fmt(-19), '£19.00');
});
test('round2 avoids float drift', () => {
  eq(round2(0.1 + 0.2), 0.3);
});
test('prettyDate labels today', () => {
  eq(prettyDate(TODAY), 'Today');
});
test('prettyDate labels yesterday', () => {
  const d = new Date(); d.setDate(d.getDate() - 1);
  eq(prettyDate(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`), 'Yesterday');
});
test('prettyDate falls back to a dated string', () => {
  ok(/^\d{1,2} [A-Z][a-z]{2} \d{4}$/.test(prettyDate('2023-04-11')));
});

/* ---------------- seed integrity ---------------- */
test('ISA ledger lands exactly on the target', () => {
  const now = new Date();
  const { isa } = buildSeed(now);
  near(isa[0].value, TARGET_ISA, 0.01, `final value ${isa[0].value}`);
});
test('ISA ledger is newest first and monotonic in value', () => {
  const { isa } = buildSeed(new Date());
  for (let i = 1; i < isa.length; i++){
    ok(isa[i].date <= isa[i-1].date, `date order broken at ${i}`);
    ok(isa[i].value <= isa[i-1].value, `value order broken at ${i}`);
  }
});
test('seed account ledger carries a running balance', () => {
  const { tx } = buildSeed(new Date());
  ok(tx.length > 500, 'ledger too short');
  ok(tx.every(t => typeof t.bal === 'number' && !Number.isNaN(t.bal)), 'missing balance');
});
test('seeded balance is derived, never stored separately', () => {
  withState();
  const s = getState();
  eq(balNow(), s.tx[0].bal);
});

/* ---------------- trend ---------------- */
test('balanceSeries always returns the requested length', () => {
  withState();
  eq(balanceSeries(90).length, 90);
});
test('balanceSeries has no null holes', () => {
  withState();
  ok(balanceSeries(90).every(p => typeof p.v === 'number'));
});
test('balanceSeries survives a single-day window', () => {
  withState();
  ok(balanceSeries(1).length >= 1);
});
test('balanceSeries carries a flat ledger without breaking', () => {
  withState(s => { s.tx = [{ id: 'a', date: TODAY, time: '09:00', name: 'X', cat: 'Income', amt: 100, bal: 100, note: '' }]; });
  const series = balanceSeries(30);
  eq(series.length, 30);
  ok(series.every(p => p.v === 100));
});

/* ---------------- left to spend ---------------- */
test('leftToSpend stays positive with a healthy balance', () => {
  withState(s => { s.tx = bigBalance(); });
  ok(leftToSpend() > 0, `got ${leftToSpend()}`);
});
test('leftToSpend floors at zero when the balance is empty', () => {
  withState(s => { s.tx = [{ id: 'a', date: TODAY, time: '09:00', name: 'X', cat: 'Income', amt: 0, bal: 0, note: '' }]; });
  eq(leftToSpend(), 0);
});
test('leftToSpend subtracts committed bills', () => {
  withState(s => { s.tx = bigBalance(); });
  const before = leftToSpend();
  ok(before < balNow(), 'committed bills not deducted');
});

/* ---------------- pots ---------------- */
test('moveToPot rejects more than the balance', () => {
  withState(s => { s.tx = [{ id: 'a', date: TODAY, time: '09:00', name: 'X', cat: 'Income', amt: 50, bal: 50, note: '' }]; });
  const res = moveToPot(getState().pots[0].id, 500, 'in');
  eq(res.ok, false);
});
test('moveToPot moves money and writes a transfer', () => {
  withState(s => { s.tx = bigBalance(); });
  const pot = getState().pots[0], before = pot.bal, txBefore = getState().tx.length;
  const res = moveToPot(pot.id, 100, 'in');
  eq(res.ok, true);
  eq(round2(getState().pots[0].bal), round2(before + 100));
  eq(getState().tx.length, txBefore + 1);
  eq(getState().tx[0].cat, 'Transfers');
});
test('moveToPot rejects withdrawing more than the pot holds', () => {
  withState(s => { s.tx = bigBalance(); s.pots[0].bal = 10; });
  eq(moveToPot(getState().pots[0].id, 100, 'out').ok, false);
});

/* ---------------- payments ---------------- */
test('sendMoney rejects more than the balance', () => {
  withState(s => { s.tx = [{ id: 'a', date: TODAY, time: '09:00', name: 'X', cat: 'Income', amt: 5, bal: 5, note: '' }]; });
  eq(sendMoney(getState().payees[0].id, 100, 'Test').ok, false);
});
test('sendMoney debits and stamps the payee as recent', () => {
  withState(s => { s.tx = bigBalance(); });
  const payee = getState().payees[1];
  const res = sendMoney(payee.id, 25, 'Rent share');
  eq(res.ok, true);
  eq(getState().tx[0].amt, -25);
  eq(getState().payees.find(p => p.id === payee.id).last, TODAY);
});

/* ---------------- plans ---------------- */
test('free plan blocks virtual cards', () => {
  withState(s => { s.plan = 'free'; s.vcards = []; });
  eq(addVirtualCard().ok, false);
});
test('Max allows a virtual card up to the live cap', () => {
  withState(s => { s.plan = 'max'; s.vcards = []; });
  eq(addVirtualCard().ok, true);
});
test('virtual cards stop at the live cap', () => {
  withState(s => { s.plan = 'max'; });
  while (getState().vcards.length < PLANS.max.vcLive) addVirtualCard();
  eq(addVirtualCard().ok, false);
});
test('switching plan charges only the difference', () => {
  withState(s => { s.plan = 'extra'; s.tx = bigBalance(); });
  const before = balNow();
  setPlan('perks');
  near(before - balNow(), PLANS.perks.price - PLANS.extra.price, 0.01);
});
test('downgrading charges nothing', () => {
  withState(s => { s.plan = 'max'; s.tx = bigBalance(); });
  const before = balNow();
  setPlan('free');
  eq(balNow(), before);
});

/* ---------------- flex ---------------- */
test('flexPurchase refuses more than the available limit', () => {
  withState();
  eq(flexPurchase('Test', flexAvail() + 1, 3).ok, false);
});
test('flexPurchase reduces the available limit', () => {
  withState();
  const before = flexAvail();
  eq(flexPurchase('Test', 300, 3).ok, true);
  near(before - flexAvail(), 300, 0.01);
});
test('a three month plan is interest free', () => {
  withState();
  flexPurchase('Test', 300, 3);
  near(getState().flex.plans[0].monthly, 100, 0.01);
});
test('a twelve month plan carries interest', () => {
  withState();
  flexPurchase('Test', 1200, 12);
  ok(getState().flex.plans[0].monthly > 100);
});
test('runTick clears a plan and restores the limit', () => {
  withState(s => {
    s.tx = bigBalance();
    s.flex.used = 100;
    s.flex.plans = [{ id: 'p', name: 'Test', amount: 100, remaining: 100, term: 3, monthly: 33.34 }];
    s.lastTick = '';
  });
  runTick(); runTick(); runTick(); runTick();
  eq(getState().flex.plans.length, 0);
  eq(round2(getState().flex.used), 0);
});

/* ---------------- loans ---------------- */
test('takeLoan rejects amounts under £1,000', () => {
  withState();
  eq(takeLoan(500, 24).ok, false);
});
test('takeLoan rejects amounts over £35,000', () => {
  withState();
  eq(takeLoan(40000, 24).ok, false);
});
test('takeLoan credits the account and records the agreement', () => {
  withState(s => { s.tx = bigBalance(); });
  const before = balNow();
  eq(takeLoan(5000, 24).ok, true);
  near(balNow() - before, 5000, 0.01);
  eq(getState().loans.length, 1);
});
test('loan repayments amortise the outstanding balance', () => {
  withState(s => { s.tx = bigBalance(); s.lastTick = ''; });
  takeLoan(2000, 12);
  const start = getState().loans[0].outstanding;
  runTick();
  ok(getState().loans[0].outstanding < start, 'outstanding did not fall');
});

/* ---------------- overdraft ---------------- */
test('overdraft over £1,000 is priced at 19%', () => {
  withState();
  arrangeOverdraft(1500);
  eq(getState().overdraft.rate, 19);
});
test('overdraft under £1,000 is priced at 29%', () => {
  withState();
  arrangeOverdraft(500);
  eq(getState().overdraft.rate, 29);
});

/* ---------------- challenge ---------------- */
test('challenge starts at 1p', () => {
  withState(s => { s.tx = bigBalance(); });
  const res = challengeSave();
  eq(res.ok, true);
  near(res.amt, 0.01, 0.001);
});
test('challenge refuses past day 365', () => {
  withState(s => { s.tx = bigBalance(); s.challenge = { day: 365, saved: 667.95 }; });
  eq(challengeSave().ok, false);
});

/* ---------------- billsback ---------------- */
test('billsback needs a qualifying plan', () => {
  withState(s => { s.plan = 'free'; s.billsback = { optIn: true, history: [] }; });
  eq(billsbackOptIn().ok, false);
});
test('billsback draw needs opt-in', () => {
  withState(s => { s.plan = 'extra'; s.billsback = { optIn: false, history: [] }; });
  eq(billsbackDraw().ok, false);
});
test('billsback pays back no more than the cap', () => {
  withState(s => {
    s.plan = 'extra';
    s.billsback = { optIn: true, history: [] };
    s.tx = [{ id: 'b', date: TODAY, time: '06:00', name: 'British Gas', cat: 'Bills',
      amt: -400, bal: 5000, note: '' }];
  });
  const real = Math.random;
  Math.random = () => 0.01;            // force a win and a stable pick
  try {
    const res = billsbackDraw();
    eq(res.ok, true);
    eq(res.won, true);
    ok(res.amount <= BB_CAP, `paid back ${res.amount}`);
    near(res.amount, BB_CAP, 0.01);
  } finally { Math.random = real; }
});
test('billsback only counts bills from the provider list', () => {
  withState(s => {
    s.plan = 'extra';
    s.billsback = { optIn: true, history: [] };
    s.tx = [{ id: 'b', date: TODAY, time: '06:00', name: 'Corner Shop', cat: 'Bills',
      amt: -400, bal: 5000, note: '' }];
  });
  eq(billsbackDraw().ok, false);
});

/* ---------------- ISA ---------------- */
test('allowance used only counts subscriptions this tax year', () => {
  withState();
  ok(tyUsed() >= 0 && tyUsed() <= 20000);
});

/* ---------------- migrations ---------------- */
test('a v11 blob migrates forward without losing data', () => {
  localStorage.setItem(KEY, JSON.stringify({
    v: 11, tx: [{ id: 'a', date: TODAY, time: '09:00', name: 'Keep', cat: 'Income', amt: 1, bal: 1, note: '' }],
    isa: [], pots: [], targets: { Groceries: 100 }, payees: [], sos: [], tabs: [], vcards: [],
    profile: { name: 'Jason Armstrong' }, plan: 'max', pin: '2580'
  }));
  load();
  const s = getState();
  eq(s.v, VERSION);
  eq(s.tx[0].name, 'Keep');
  ok(Array.isArray(s.flex.plans));
  ok(Array.isArray(s.loans));
  ok(Array.isArray(s.connected));
  ok(typeof s.billsback.optIn === 'boolean');
  ok(s.layout.length > 0);
});
test('migrate is idempotent', () => {
  const once = migrate({ v: 11, tx: [], isa: [], pots: [], targets: {} });
  const twice = migrate({ ...once });
  eq(twice.v, once.v);
  eq(twice.layout.length, once.layout.length);
});
test('a newer blob falls back to a fresh state', () => {
  localStorage.setItem(KEY, JSON.stringify({ v: 99 }));
  load();
  eq(getState().v, VERSION);
  ok(getState().tx.length > 0);
});

/* ---------------- runner ---------------- */
function render(){
  out.innerHTML = '';
  let passed = 0;
  results.forEach(r => {
    const li = document.createElement('li');
    li.className = r.ok ? 'pass' : 'fail';
    li.innerHTML = `<span class="mark">${r.ok ? '✓' : '✗'}</span>
      <span>${r.name}${r.ok ? '' : `<span class="err">${r.err}</span>`}</span>`;
    out.appendChild(li);
    if (r.ok) passed++;
  });
  const failed = results.length - passed;
  summary.className = failed ? 'bad' : 'good';
  summary.textContent = failed
    ? `${failed} failed · ${passed} passed`
    : `All ${passed} passed`;
}

document.getElementById('run').onclick = () => {
  results.length = 0;
  render();
  location.reload();
};

document.getElementById('reset').onclick = () => {
  localStorage.removeItem(KEY);
  location.reload();
};

render();
</script>
</body>
</html>
